- 道しるべの文（「先に結論を述べます」「以下では〜を見ていきます」）を書かない
- 警句めいた締めの一文（決め台詞）を書かない
- 「A ではなく B」の言い直しで強調しない。B を直接書く
- 立場や範囲の宣言（「私の立場をはっきりさせておきます」「〜はここでは扱いません」）を書かない
- 自分の整理への但し書き（「これは私の見立てです」）を書かない
- 見出しは主張の文にせず、内容を指す短い名詞句にする
- 同じ形の並列（利点・注意点・事例の列挙）を何段も続けない
- FAQ の節や、頼まれていない一般的な助言の節を作らない
- 材料に無い体験・計測・感想を書き手のものとして作らない
- ウェブで確かめた事実には出典のリンクを付ける。出典の無い数値を足さない
- 太字で始まる箇条書き・絵文字・飾り記号を使わない
- 一度書いたことを、節の終わりや「まとめ」の節で繰り返さない
- 読者が知っている前提を丁寧に言い直さない。説明は一度だけ、必要な所で
