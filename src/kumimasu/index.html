<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="kumimasu-token" content="{{KUMIMASU_TOKEN}}">
<title>記事の設計</title>
<style>
:root {
  --bg: #f7f5f0; --paper: #fffdf9; --ink: #23262b; --muted: #6f747c; --line: #e3ded4; --soft: #efebe3;
  --accent: #2f6f8f; --bad: #b42318; --code-bg: #f1eee7;
  --yes: #9aa0a8; --partial: #c48a1c; --no: #2e7d4f; --answer: #2f6f8f;
  --deep: #2e7d4f; --mention: #6f747c; --drop: #b42318; --ok: #2b8a3e;
  --k-meta: #d9822b; --k-glue: #8e5bd0; --k-lint: #7a8088; --k-drop: #c0392b; --k-fabrication: #a5281b;
  --k-number: #2f6f8f; --k-link: #2f6f8f; --k-user: #2e7d4f;
  --sans: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Code", "Menlo", "Consolas", "Noto Sans Mono CJK JP", monospace;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --paper: #1b1e22; --ink: #e4e2dd; --muted: #9a9fa6; --line: #2e3238; --soft: #24282d;
    --accent: #7cb7d4; --bad: #f08a80; --code-bg: #22262b;
    --yes: #6b7179; --partial: #e0b050; --no: #6cc28f; --answer: #7cb7d4;
    --deep: #6cc28f; --mention: #9a9fa6; --drop: #f08a80; --ok: #6cc28f;
    --k-meta: #f0a860; --k-glue: #b896f0; --k-lint: #a3a9b1; --k-drop: #f0857a; --k-fabrication: #f07a6e;
    --k-number: #7cb7d4; --k-link: #7cb7d4; --k-user: #6cc28f;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.65; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
header { padding: 16px 24px 10px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 17px; margin: 0; }
header .meta { color: var(--muted); font-size: 12.5px; }
[hidden] { display: none !important; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 440px); gap: 20px; padding: 16px 24px 80px; max-width: 1400px; margin: 0 auto; }
h2 { font-size: 14.5px; margin: 0 0 8px; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
.side { position: sticky; top: 12px; align-self: start; max-height: calc(100vh - 24px); overflow: auto; }
.legend, .filters { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 4px; vertical-align: -1px; }
.filters button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 1px 10px; font-size: 12px; }
.filters button.on { background: var(--soft); border-color: var(--muted); }
.unit { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.unit:first-child { border-top: 0; }
.unit .bar { border-radius: 2px; background: var(--c); }
.unit .head { font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
.unit .text { white-space: pre-wrap; overflow-wrap: anywhere; }
.unit pre { font-family: var(--mono); font-size: 12.5px; background: var(--code-bg); border-radius: 6px; padding: 6px 8px; margin: 2px 0 0; overflow-x: auto; white-space: pre; }
.unit.drop .text, .unit.drop pre { opacity: .45; }
.unit a { color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; height: fit-content; }
.seg button { border: 0; background: transparent; padding: 2px 8px; font-size: 12px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on[data-use="deep"] { background: var(--deep); color: #fff; }
.seg button.on[data-use="mention"] { background: var(--mention); color: #fff; }
.seg button.on[data-use="drop"] { background: var(--drop); color: #fff; }
.q { margin: 0 0 14px; }
.q .qt { font-weight: 600; }
.q .why { color: var(--muted); font-size: 12px; margin: 2px 0 4px; }
.q .refs { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
textarea, input[type=number] { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 6px 8px; }
textarea { min-height: 64px; resize: vertical; }
label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 3px; }
.note { color: var(--muted); font-size: 12.5px; }
.warn { margin: 4px 0 0; padding-left: 1.2em; color: var(--partial); font-size: 12.5px; }
.rule { display: flex; gap: 6px; align-items: center; margin: 3px 0; }
.rule input[type=text] { flex: 1; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 3px 6px; }
.rule.off input[type=text] { opacity: .5; text-decoration: line-through; }
.rule button, .add { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 1px 8px; color: var(--muted); }
.tools { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.noise { display: flex; gap: 8px; align-items: center; margin: 2px 0; }
.noise input { flex: 1; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 3px 6px; }
.seg button.on[data-noise] { background: var(--answer); color: #fff; }
.counts { font-size: 12px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
#status { position: fixed; right: 16px; bottom: 12px; font-size: 12px; color: var(--muted); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; }
#status.err { color: var(--bad); }
.stages { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.stages button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 2px 12px; font-size: 12.5px; color: var(--muted); }
.stages button.cur { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.stages button.on { background: var(--soft); }
.stages button:disabled { opacity: .45; cursor: default; }
.stages .sep { color: var(--muted); font-size: 12px; }
.stages .round { margin-left: 8px; color: var(--muted); font-size: 12px; }
.ro-banner { padding: 8px 24px; background: var(--soft); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.drafting { max-width: 720px; margin: 32px auto; padding: 0 16px; }
.confirm-bar { position: sticky; bottom: 0; display: flex; gap: 10px; align-items: flex-end; padding: 10px 24px; background: var(--bg); border-top: 1px solid var(--line); z-index: 5; }
.confirm-bar textarea { flex: 1; min-height: 40px; max-height: 120px; }
.confirm-bar .primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); border-radius: 6px; padding: 6px 14px; font-size: 13px; white-space: nowrap; }
.fc-bar button, .fc-pop button { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 2px 10px; font-size: 12.5px; }
.fc-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 24px; border-bottom: 1px solid var(--line); }
.fc-bar select { font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.fc-bar .primary { margin-left: auto; background: var(--accent); color: #fff; border-color: var(--accent); }
.inline { display: inline; margin: 0; font-size: 13px; color: var(--ink); }
.fc-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.fc-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.fc-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px); gap: 20px; padding: 16px 24px 40px; max-width: 1400px; margin: 0 auto; }
.fc-article { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 28px 36px; font-size: 16px; line-height: 1.9; }
.fc-article > * { max-width: 40em; }
.fc-article h2 { font-size: 1.25em; border-bottom: 1px solid var(--line); padding-bottom: .2em; margin: 1.6em 0 .6em; }
.fc-article h3, .fc-article h4 { font-size: 1.08em; margin: 1.4em 0 .5em; }
.fc-article p { margin: 0 0 1em; }
.fc-article code { font-family: var(--mono); font-size: .88em; background: var(--code-bg); border-radius: 4px; padding: .05em .3em; }
.fc-article pre { font-family: var(--mono); font-size: 13px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.fc-article pre code { background: none; padding: 0; }
.fc-article table { border-collapse: collapse; font-size: .92em; display: block; overflow-x: auto; margin: 0 0 1em; }
.fc-article th, .fc-article td { border: 1px solid var(--line); padding: .3em .6em; }
.fc-article a { color: var(--accent); }
.fc-article .img-ph { display: block; border: 1.5px dashed var(--line); border-radius: 8px; padding: 1em; text-align: center; color: var(--muted); font-size: 13px; }
mark.fc { background: color-mix(in srgb, var(--c) 26%, transparent); color: inherit; border-bottom: 2px solid var(--c); cursor: pointer; border-radius: 2px; }
mark.fc.keep { background: transparent; border-bottom-style: dotted; }
mark.fc.delete { text-decoration: line-through; text-decoration-color: var(--bad); opacity: .65; }
mark.fc.rewrite { border-bottom-style: dashed; }
mark.chg { background: color-mix(in srgb, var(--ok) 22%, transparent); border-bottom: 2px solid var(--ok); border-radius: 2px; color: inherit; cursor: help; }
.chg-del { display: inline-block; font-size: 11px; line-height: 1; padding: 1px 4px; margin: 0 2px; border-radius: 4px; color: var(--bad); border: 1px solid var(--bad); cursor: help; vertical-align: middle; }
mark.fc.focus { outline: 2px solid var(--c); outline-offset: 1px; }
.fc-side { position: sticky; top: 12px; align-self: start; max-height: calc(100vh - 24px); overflow: auto; }
.fc-item { border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 8px; background: var(--paper); padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
.fc-item .k { font-size: 11.5px; color: var(--muted); }
.fc-item .t { font-size: 13px; overflow-wrap: anywhere; }
.fc-item .d { font-size: 12px; margin-top: 2px; font-weight: 600; }
.fc-item.done { opacity: .75; }
.fc-pop { position: absolute; z-index: 10; width: min(420px, calc(100vw - 32px)); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.18); padding: 10px 12px; font-size: 13px; }
.fc-pop .k { color: var(--muted); font-size: 12px; }
.fc-pop .quote { margin: 4px 0; overflow-wrap: anywhere; }
.fc-pop .reason, .fc-pop .unit { color: var(--muted); font-size: 12px; margin: 4px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.fc-pop .acts { display: flex; gap: 6px; margin: 8px 0 4px; flex-wrap: wrap; }
.fc-pop button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.fc-pop textarea { min-height: 52px; }
.badge { display: inline-block; font-size: 11px; font-weight: 500; border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; color: var(--muted); }
.badge.bad { color: var(--bad); border-color: var(--bad); }
.warn-box { color: var(--bad); font-size: 12px; margin: 6px 0; }
.fc-used { margin: 0 24px; padding: 6px 0; font-size: 13px; }
.fc-used summary { cursor: pointer; color: var(--muted); }
.fc-used h4 { font-size: 12.5px; margin: 10px 0 4px; }
.fc-used ul { margin: 0; padding-left: 1.4em; }
.fc-used p { margin: 4px 0; }
.fc-result { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 24px; border-bottom: 1px solid var(--line); font-size: 13px; }
.fc-result button, .fc-result a.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 2px 10px; font-size: 12.5px; color: inherit; text-decoration: none; }
.fc-result textarea { flex-basis: 100%; min-height: 160px; font-family: var(--mono); font-size: 12px; }
.fc-diff { border: 1px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink); padding: 0; width: min(900px, calc(100vw - 32px)); max-height: calc(100vh - 64px); }
.fc-diff::backdrop { background: rgb(0 0 0 / .35); }
.fc-diff .head { position: sticky; top: 0; background: var(--paper); padding: 12px 16px 8px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.fc-diff .head > div { flex: 1; }
.fc-diff .head h2 { margin: 0 0 4px; font-size: 15px; }
.fc-diff .body { padding: 10px 16px 16px; overflow: auto; }
.fc-diff pre { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.fc-diff .add { background: color-mix(in srgb, var(--ok) 18%, transparent); display: block; }
.fc-diff .del { background: color-mix(in srgb, var(--bad) 18%, transparent); display: block; text-decoration: line-through; }
.fc-diff .same { color: var(--muted); display: block; }
@media (max-width: 900px) {
  .fc-grid { grid-template-columns: 1fr; padding: 12px 16px; }
  .fc-side { position: static; max-height: none; }
  .fc-article { padding: 18px; }
  .fc-bar { padding: 10px 16px; }
  .layout { grid-template-columns: 1fr; padding: 12px 16px 60px; }
  .side { position: static; max-height: none; }
  .unit { grid-template-columns: 4px minmax(0, 1fr); }
  .unit .seg { grid-column: 2; }
}
</style>
</head>
<body>
<header><h1 id="topic">…</h1><div class="meta" id="meta"></div>
  <nav class="stages" id="stages"></nav></header>
<div id="ro-banner" class="ro-banner" hidden></div>
<div class="layout" id="view-design">
  <main>
    <section class="panel">
      <h2>材料</h2>
      <div class="legend">
        <span><i class="sw" style="--c: var(--no)"></i>手元だけ</span>
        <span><i class="sw" style="--c: var(--partial)"></i>一部は検索で届く</span>
        <span><i class="sw" style="--c: var(--yes)"></i>検索で届く</span>
        <span><i class="sw" style="--c: var(--answer)"></i>インタビューの回答</span>
      </div>
      <div class="filters" id="filters"></div>
      <div id="units"></div>
    </section>
  </main>
  <aside class="side">
    <section class="panel" id="interview"><h2>インタビュー</h2></section>
    <section class="panel" id="design"><h2>設計</h2></section>
  </aside>
</div>
<div id="view-drafting" class="drafting" hidden>
  <div class="panel"><h2>エージェントが書いています</h2>
    <p class="note">設計をもとに、エージェントが下書きを書いて検査しています。終わると自動で最終チェックの画面に切り替わります。この間は編集できません。</p>
    <div id="drafting-note"></div></div>
</div>
<div id="view-final" hidden>
  <div class="fc-bar">
    <label class="inline">下書き <select id="fc-draft"></select></label>
    <span class="fc-legend" id="fc-legend"></span>
    <span class="fc-count" id="fc-count"></span>
    <button id="fc-apply" class="primary">反映</button>
  </div>
  <div class="fc-result" id="fc-result" hidden></div>
  <details class="fc-used" id="fc-used" hidden><summary>この下書きに使った設定</summary><div id="fc-used-body"></div></details>
  <div class="fc-grid">
    <article id="fc-article" class="fc-article"></article>
    <aside class="fc-side"><div id="fc-items"></div></aside>
  </div>
  <dialog class="fc-diff" id="fc-diff"></dialog>
</div>
<div id="fc-pop" class="fc-pop" hidden></div>
<div id="confirm-bar" class="confirm-bar" hidden>
  <textarea id="confirm-note" placeholder="エージェントへの指示（任意）"></textarea>
  <button id="confirm-btn" class="primary">確定してエージェントに渡す</button>
</div>
<div id="status">読み込み中</div>
<script>
const S = { data: null, filter: "all", timers: {}, version: "", viewing: null, lastInput: 0, unitsKey: "" };
const FC = { draft: null, html: "", items: [], removed: [], table: [], timer: null, finals: {}, final: null,
  viewing: false, dirty: false, lastApply: null };
const COLOR = { yes: "var(--yes)", partial: "var(--partial)", no: "var(--no)", null: "var(--line)" };
const FILTERS = { all: "すべて", firsthand: "手元だけ・回答", searchable: "検索で届く", deep: "掘り下げる", drop: "書かない" };
const TOKEN = document.querySelector('meta[name="kumimasu-token"]').content;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const linkify = (s) => esc(s).replace(/https?:\/\/[^\s)<>\]」』]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
const L = () => S.data.labels;
const kindName = (k) => L().kind[k] || k;
const kindColor = (k) => (k in L().kind ? `var(--k-${k})` : "var(--k-lint)");

function status(msg, err) { const n = $("#status"); n.textContent = msg; n.className = err ? "err" : ""; }

function request(path, opts = {}) {
  const headers = { "X-Kumimasu-Token": TOKEN, ...(opts.headers || {}) };
  if (opts.body !== undefined) headers["Content-Type"] = "application/json";
  return fetch(path, { ...opts, headers, body: opts.body === undefined ? undefined : JSON.stringify(opts.body) });
}

async function api(path, opts) {
  const r = await request(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

const draftPath = (kind) => `/api/${kind}/${encodeURIComponent(FC.draft)}`;

function useOf(id) {
  const d = S.data.design;
  const u = d && d.units.find((x) => x.id === id);
  return u ? u.use : null;
}

function visible(u) {
  switch (S.filter) {
    case "firsthand": return u.firsthand;
    case "searchable": return u.origin === "material" && u.searchable === "yes";
    case "deep": return useOf(u.id) === "deep";
    case "drop": return useOf(u.id) === "drop";
    default: return true;
  }
}

function renderUnits() {
  const d = S.data.design;
  S.unitsKey = JSON.stringify([S.filter, S.data.units, d && [d.units, d.skip, d.aside]]);
  const f = $("#filters");
  f.innerHTML = Object.entries(FILTERS).map(([k, v]) => `<button data-f="${k}" class="${S.filter === k ? "on" : ""}">${v}</button>`).join("");
  f.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { S.filter = b.dataset.f; renderUnits(); }));
  const box = $("#units");
  box.innerHTML = "";
  const uses = L().use;
  for (const u of S.data.units.filter(visible)) {
    const use = useOf(u.id);
    const color = u.origin === "answer" ? "var(--answer)" : COLOR[u.searchable];
    const tag = u.origin === "answer" ? "回答" : L().searchable[u.searchable];
    const where = [u.source, u.section].filter(Boolean).join(" / ");
    const body = u.kind === "code" ? `<pre>${esc(u.text)}</pre>` : `<div class="text">${linkify(u.text)}</div>`;
    const isSkip = d && d.skip.some((x) => x.units.includes(u.id));
    const isAside = d && d.aside.some((x) => x.id === u.id);
    const seg = use ? `<div class="tools"><div class="seg">${Object.keys(uses).map((x) =>
      `<button data-use="${x}" class="${x === use ? "on" : ""}" title="${uses[x]}">${uses[x]}</button>`).join("")}</div>
      <div class="seg"><button data-noise="skip" class="${isSkip ? "on" : ""}" title="説明しない前提にする（書かない）">前提扱い</button>` +
      `<button data-noise="aside" class="${isAside ? "on" : ""}" title="脱線として入れる">脱線</button></div></div>` : "";
    const row = document.createElement("div");
    row.className = "unit" + (use === "drop" ? " drop" : "");
    const same = u.members && u.members.length ? ` · 同じ内容: ${u.members.map(esc).join(", ")}` : "";
    const ctx = u.context ? `<div class="why">問い: ${esc(u.context)}</div>` : "";
    row.innerHTML = `<div class="bar" style="--c: ${color}"></div><div><div class="head">${esc(u.id)} · ${esc(tag)}${where ? " · " + esc(where) : ""}${same}</div>${ctx}${body}</div>${seg}`;
    row.querySelectorAll("button[data-use]").forEach((b) => b.addEventListener("click", () => save("/api/design", { units: { [u.id]: b.dataset.use } }, true)));
    row.querySelector("button[data-noise=skip]")?.addEventListener("click", () =>
      save("/api/design", { toggle_skip: { unit: u.id, on: !isSkip } }, true));
    row.querySelector("button[data-noise=aside]")?.addEventListener("click", () =>
      save("/api/design", { toggle_aside: { unit: u.id, on: !isAside } }, true));
    box.appendChild(row);
  }
  if (!box.children.length) box.innerHTML = `<p class="note">該当する単位はありません。</p>`;
}

function renderInterview() {
  const box = $("#interview");
  const iv = S.data.interview;
  if (!iv) { box.innerHTML = `<h2>インタビュー</h2><p class="note">まだ質問がありません。<code>kumimasu interview DIR</code> を実行してください。</p>`; return; }

  const box = $("#rules");
  if (!box) return;
  const d = S.data.design;
  const push = (now) => {
    const send = () => save("/api/design", { rules: d.rules.map((r) => ({ text: r.text, on: r.on })) }, false);
    if (now) send(); else debounce("rules", send);
  };
  box.innerHTML = d.rules.map((r, i) => `<div class="rule${r.on ? "" : " off"}">
      <input type="checkbox" data-i="${i}" ${r.on ? "checked" : ""} title="オン・オフ">
      <input type="text" data-i="${i}" value="${esc(r.text)}">
      <button data-del="${i}" title="削除">×</button></div>`).join("") +
    `<button id="addrule" class="add">ルールを足す</button>`;
  box.querySelectorAll("input[type=checkbox]").forEach((el) => el.addEventListener("change", () => {
    d.rules[+el.dataset.i].on = el.checked;
    el.parentElement.classList.toggle("off", !el.checked);
    push(true);
  }));
  box.querySelectorAll("input[type=text]").forEach((el) => el.addEventListener("input", () => {
    d.rules[+el.dataset.i].text = el.value;

    d.rules.splice(+el.dataset.del, 1);

    d.rules.push({ text: "", on: true });

  });

function debounce(key, fn) {
  status("未保存");
  clearTimeout(S.timers[key]);
  S.timers[key] = setTimeout(() => { delete S.timers[key]; fn(); }, 600);
}

function unitsChanged() {

}

async function save(path, body, rerender) {
  status("保存中…");

    S.data = await api(path, { method: "PUT", body });
    S.version = S.data.version;
    status("保存しました");
    if (rerender) { renderUnits(); renderDesign(); return; }
    if (unitsChanged()) renderUnits();

}

function showScreen(s) {
  S.viewing = s;
  const st = S.data.stage;
  const editable = s === st.stage && L().human_stages.includes(s);
  const screen = s === "interview" || s === "design" ? "design" : s === "drafting" ? "drafting" : "final";
  $("#view-design").hidden = screen !== "design";
  $("#view-drafting").hidden = screen !== "drafting";
  $("#view-final").hidden = screen !== "final";
  $("#design").hidden = s === "interview";
  $("#interview").inert = !(editable && s === "interview");
  $("#design").inert = !(editable && s === "design");
  $("#units").inert = !(editable && s === "design");
  $("#fc-article").inert = !editable;
  $("#fc-items").inert = !editable;
  $("#fc-apply").hidden = !editable;
  const banner = $("#ro-banner");
  const last = st.last_handoff;
  if (st.stage === "done" && (s === "review" || s === "done")) {
    banner.hidden = false;
    banner.textContent = `完了しました。確定した記事: ${last && last.final ? last.final : ""}`;
  } else if (!editable && s !== "drafting") {
    banner.hidden = false;
    banner.textContent = `読み取り専用（今の段階: ${st.labels[st.stage]}）`;
  } else banner.hidden = true;
  if (screen === "drafting") $("#drafting-note").innerHTML = last && last.note ? `<p>エージェントへの指示（本人が書いたもの）: ${esc(last.note)}</p>` : "";
  $("#confirm-bar").hidden = !editable;
  renderStages();
  if (screen === "final") openFinal().catch((e) => status("読み込めません: " + e.message, true));
}

function busy() {
  return Object.keys(S.timers).length > 0 || FC.timer || Date.now() - S.lastInput < 4000 || !$("#fc-pop").hidden || $("#fc-diff").open;
}

async function poll() {
  try {
    const r = await request("/api/version", { headers: { "If-None-Match": `"${S.version}"` } });
    if (r.status === 200) {
      const v = await r.json();
      if (v.version !== S.version && !busy()) await reload();
    }
  } catch (e) { /* the server may be restarting; try again on the next tick */ }
  setTimeout(poll, S.data.poll_seconds * 1000);
}

async function reload() {
  const prev = S.data.stage.stage;
  S.data = await api("/api/state");
  S.version = S.data.version;
  renderAll();
  const now = S.data.stage.stage;
  showScreen(now !== prev ? now : S.viewing);
  status(now !== prev ? `段階が「${S.data.stage.labels[now]}」になりました` : "更新しました");
}

async function confirmStage() {
  try {
    if (FC.timer) { clearTimeout(FC.timer); FC.timer = null; await pushReview(false); }
    status("確定中…");
    const r = await api("/api/confirm", { method: "POST", body: { note: $("#confirm-note").value } });
    $("#confirm-note").value = "";
    S.data = r; S.version = r.version;
    renderAll();
    showScreen(r.stage.stage);
    status(`確定しました。エージェントに渡しました（次: ${r.stage.labels[r.stage.stage]}）`);
  } catch (e) { status("確定できません: " + e.message, true); }
}

function cpLen(text) {
  let n = 0;
  for (let i = 0; i < text.length; i += text.codePointAt(i) > 0xffff ? 2 : 1) n++;
  return n;
}

function u16(text, cp) {
  let i = 0;
  for (; cp > 0 && i < text.length; cp--) i += text.codePointAt(i) > 0xffff ? 2 : 1;
  return i;
}

function spanTable(root) {
  const table = [];
  for (const sp of root.querySelectorAll("span[data-s]")) {
    let at = +sp.dataset.s;
    const walker = document.createTreeWalker(sp, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      const n = cpLen(walker.currentNode.data);
      table.push({ node: walker.currentNode, start: at, len: n });
      at += n;
    }
  }
  return table.sort((a, b) => a.start - b.start);
}

function firstAfter(table, pos) {
  let lo = 0, hi = table.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (table[mid].start + table[mid].len <= pos) lo = mid + 1; else hi = mid;
  }
  return lo;
}

function wrapRange(table, a, b, make) {
  let k = firstAfter(table, a);
  while (k < table.length && table[k].start < b) {
    const e = table[k];
    const x = Math.max(a, e.start) - e.start, y = Math.min(b, e.start + e.len) - e.start;
    if (x >= y || (make.skip && make.skip(e.node))) { k++; continue; }
    const parts = [];
    let mid = e.node;
    if (x > 0) { parts.push({ node: mid, start: e.start, len: x }); mid = mid.splitText(u16(mid.data, x)); }
    if (y < e.len) mid.splitText(u16(mid.data, y - x));
    const right = y < e.len ? mid.nextSibling : null;
    const w = make();
    mid.parentNode.insertBefore(w, mid);
    w.appendChild(mid);
    parts.push({ node: mid, start: e.start + x, len: y - x });
    if (right) parts.push({ node: right, start: e.start + y, len: e.len - y });
    table.splice(k, 1, ...parts);
    k += parts.length;
  }
}

function insertAt(table, pos, el) {
  const k = Math.min(firstAfter(table, pos), table.length - 1);
  if (k < 0) return;
  const e = table[k];
  const x = Math.max(0, Math.min(e.len, pos - e.start));
  const rest = x < e.len ? e.node.splitText(u16(e.node.data, x)) : null;
  e.node.parentNode.insertBefore(el, rest || e.node.nextSibling);
  if (rest) table.splice(k, 1, { node: e.node, start: e.start, len: x }, { node: rest, start: pos, len: e.len - x });
}

function offsetOf(node, off) {
  if (node.nodeType !== 3) return null;
  const e = FC.table.find((x) => x.node === node);
  return e ? e.start + cpLen(node.data.slice(0, off)) : null;
}

async function openFinal() {
  const r = await api("/api/drafts");
  const drafts = r.drafts.map((d) => d.name);
  FC.finals = Object.fromEntries(r.drafts.map((d) => [d.name, d.final]));
  const sel = $("#fc-draft");
  sel.innerHTML = drafts.map((d) => `<option value="${esc(d)}">${esc(d)}${FC.finals[d] ? "（反映済み）" : ""}</option>`).join("");
  if (!drafts.length) { $("#fc-article").innerHTML = `<p class="note">draft*.md がありません。</p>`; return; }
  const want = S.data.stage.draft;
  FC.draft = drafts.includes(FC.draft) ? FC.draft : drafts.includes(want) ? want : drafts[0];
  sel.value = FC.draft;
  $("#fc-legend").innerHTML = Object.keys(L().kind).map((k) => `<span><i class="sw" style="--c:${kindColor(k)}"></i>${esc(kindName(k))}</span>`).join("");
  await loadDraft(FC.draft);
}

async function loadDraft(name) {
  FC.draft = name;
  FC.viewing = false;
  FC.final = null;
  const r = await api(draftPath("review"));
  FC.html = r.html; FC.items = r.items; FC.dirty = r.dirty;
  renderUsed(r.used);
  if ($("#fc-diff").open) $("#fc-diff").close();
  paintFinal();
  renderResult();
  setApplyEnabled();
  if (!r.checked) status("この下書きの検査結果がありません（kumimasu check --draft " + name + "）");
}

function setApplyEnabled() {
  const b = $("#fc-apply");
  b.disabled = FC.viewing || !FC.dirty;
  b.title = FC.viewing ? "決定は元の下書きで変えます" : FC.dirty ? "" : "前回の反映から決定が変わっていません";
}

function renderUsed(u) {
  const box = $("#fc-used");
  box.hidden = !u;
  if (!u) return;
  const list = (xs) => xs.length ? `<ul>${xs.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : "<p class=\"note\">なし</p>";
  $("#fc-used-body").innerHTML = `<p>文体: ${esc(L().register[u.register] || u.register)} · 書かない事柄の載せ方: ${esc(u.drop_list)} · 設計: ${esc(u.design)}</p>
    <p>LLM: ${Object.entries(u.providers).map(([k, v]) => `${esc(k)}=${esc(v)}`).join(" · ")}</p>
    <h4>書き方のルール（オン）</h4>${list(u.rules)}
    ${u.rules_off.length ? `<h4>オフにしたルール</h4>${list(u.rules_off)}` : ""}
    <h4>書かない話題</h4>${list(u.avoid)}
    <h4>形</h4>${list(u.forms)}${u.form_prefs ? `<p>好み: ${esc(u.form_prefs)}</p>` : ""}
    ${u.skip.length ? `<h4>説明しない前提</h4>${list(u.skip)}` : ""}
    ${u.aside.length ? `<h4>脱線</h4>${list(u.aside)}` : ""}`;
}

function renderResult() {
  const box = $("#fc-result");
  const out = FC.finals[FC.draft];
  if (!out) { box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = `<span>結果: <b>${esc(out)}</b>（読み取り専用。直すときは ${esc(FC.draft)} の決定を変えて反映し直す）</span>
    <button id="fc-view">${FC.viewing ? "下書きに戻る" : "結果を見る"}</button>
    ${FC.lastApply ? `<button id="fc-diffbtn">差分</button>` : ""}
    <button id="fc-copy">コピー</button>
    <button id="fc-download">ダウンロード</button>
    <textarea id="fc-copybox" readonly hidden></textarea>`;
  $("#fc-view").addEventListener("click", () => toggleResult().catch((e) => status("読み込めません: " + e.message, true)));
  $("#fc-copy").addEventListener("click", copyResult);
  $("#fc-download").addEventListener("click", downloadResult);
  if (FC.lastApply) $("#fc-diffbtn").addEventListener("click", showDiff);
}

async function finalText() {
  if (!FC.final || FC.final.draft !== FC.draft) FC.final = await api(draftPath("final"));
  return FC.final;
}

async function toggleResult() {
  if (FC.viewing) { FC.viewing = false; paintFinal(); renderResult(); setApplyEnabled(); return; }
  const r = await finalText();
  FC.viewing = true;
  const nr = r.changes.filter((c) => c.kind === "rewritten").length, nd = r.changes.filter((c) => c.kind === "deleted").length;
  const art = $("#fc-article");
  art.innerHTML = `<p class="note">${esc(r.final)}（読み取り専用）· <mark class="chg">書き直した所</mark> ${nr} · <span class="chg-del">削除</span> ${nd}（印にマウスを載せると元の文）</p>` + r.html;
  markChanges(spanTable(art), r.changes);
  $("#fc-items").innerHTML = `<p class="note">反映の結果を表示しています。決定は元の下書きで変えます。</p>`;
  setApplyEnabled();
  renderResult();
}

function markChanges(table, changes) {
  for (const c of changes.filter((x) => x.kind === "deleted")) {
    const m = document.createElement("span");
    m.className = "chg-del"; m.textContent = "削除"; m.title = "削除した文: " + c.before;
    insertAt(table, c.start, m);
  }
  for (const c of changes.filter((x) => x.kind === "rewritten")) {
    wrapRange(table, c.start, c.end, () => {
      const w = document.createElement("mark");
      w.className = "chg"; w.title = "元の文: " + c.before;
      return w;
    });
  }
}

async function downloadResult() {
  try {
    const r = await request(draftPath("download"));
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    const m = /filename\*=UTF-8''([^;]+)/.exec(r.headers.get("Content-Disposition") || "");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(await r.blob());
    a.download = m ? decodeURIComponent(m[1]) : "final.md";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } catch (e) { status("ダウンロードできません: " + e.message, true); }
}

async function copyResult() {
  let r;
  try { r = await finalText(); } catch (e) { status("読み込めません: " + e.message, true); return; }
  try {
    await navigator.clipboard.writeText(r.markdown);
    status("コピーしました: " + r.final);
  } catch (e) {
    const box = $("#fc-copybox");
    box.hidden = false; box.value = r.markdown; box.focus(); box.select();
    status("クリップボードに書けませんでした。下の欄から手でコピーしてください", true);
  }
}

function paintFinal() {
  const art = $("#fc-article");
  art.innerHTML = FC.html;
  FC.table = spanTable(art);
  const placed = FC.items.filter((i) => i.start !== null && i.end !== null).sort((a, b) => (b.end - b.start) - (a.end - a.start));
  for (const it of placed) {
    wrapRange(FC.table, it.start, it.end, () => {
      const w = document.createElement("mark");
      w.className = "fc " + (it.decision || "");
      w.dataset.item = it.id;
      w.style.setProperty("--c", kindColor(it.kind));
      w.addEventListener("click", (e) => { e.stopPropagation(); itemPop(it.id, w.getBoundingClientRect()); });
      return w;
    });
  }
  renderItems();
}

function rewriteBadge(it) {
  if (it.stale) return ` <span class="badge bad">古い（下書きが変わった）</span>`;
  if (it.decision !== "rewrite") return "";
  if (!it.rewrite) return ` <span class="badge">未生成</span>`;
  return ` <span class="badge">固定${it.rewrite.source === "user" ? "・手で直した" : ""}</span>` + (it.note_changed ? ` <span class="badge bad">メモ変更</span>` : "");
}

function itemHead(it, votes) {
  return `${esc(kindName(it.kind))}${it.category ? " · " + esc(it.category) : ""}${it.votes ? votes + esc(it.votes) : ""}`;
}

function renderItems() {
  const box = $("#fc-items");
  const decided = FC.items.filter((i) => i.decision).length;
  $("#fc-count").textContent = `${FC.items.length} 項目 · 決めた ${decided}`;
  box.innerHTML = FC.items.map((it) => `<div class="fc-item${it.decision ? " done" : ""}" data-item="${esc(it.id)}" style="--c:${kindColor(it.kind)}">
      <div class="k">${itemHead(it, " · ")}${it.start === null ? " · 位置不明" : ""}</div>
      <div class="t">${esc(it.text.slice(0, 90))}${it.text.length > 90 ? "…" : ""}</div>
      <div class="d">${esc(L().decision[it.decision])}${it.note ? `：${esc(it.note)}` : ""}${rewriteBadge(it)}</div></div>`).join("") ||
    `<p class="note">検査で当たった箇所はありません。本文を選ぶと自分の項目を足せます。</p>`;
  box.querySelectorAll(".fc-item").forEach((el) => el.addEventListener("click", () => {
    const m = [...document.querySelectorAll("mark.fc")].find((x) => x.dataset.item === el.dataset.item);
    document.querySelectorAll("mark.fc.focus").forEach((x) => x.classList.remove("focus"));
    if (m) { m.scrollIntoView({ block: "center" }); m.classList.add("focus"); }
    itemPop(el.dataset.item, (m || el).getBoundingClientRect());
  }));
}

function placeFcPop(pop, rect) {
  pop.hidden = false;
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = rect.left + window.scrollX + rect.width / 2 - w / 2;
  left = Math.max(8 + window.scrollX, Math.min(left, window.scrollX + document.documentElement.clientWidth - w - 8));
  let top = rect.bottom + window.scrollY + 8;
  if (rect.bottom + h + 16 > window.innerHeight) top = Math.max(window.scrollY + 8, rect.top + window.scrollY - h - 8);
  pop.style.left = `${left}px`; pop.style.top = `${top}px`;
}

function decisionButtons(cur) {
  return `<div class="acts">${Object.entries(L().decision).filter(([d]) => d).map(([d, label]) =>
    `<button data-d="${d}" class="${cur === d ? "on" : ""}">${esc(label)}</button>`).join("")}</div>`;
}

function rewriteBlock(it) {
  if (it.decision !== "rewrite") return "";
  if (it.stale) return `<div class="warn-box">下書きが変わったため、この項目は反映しません（元の文: 「${esc(it.rewrite ? it.rewrite.made_from : it.text)}」）。` +
    `決め直すか、書き直し直してください。</div><div class="acts"><button id="fc-regen">もう一度書き直す</button></div>`;
  if (!it.rewrite) return `<div class="reason">まだ書き直していません。次の反映で、この項目だけを書き直します。</div>`;
  const src = it.rewrite.source === "user" ? "手で直した" : "LLM";
  return `<label>書き直し結果（${src}・固定。ほかの項目を変えても変わりません）</label>
    <textarea id="fc-rewrite-text">${esc(it.rewrite.result)}</textarea>
    ${it.note_changed ? `<div class="warn-box">メモが、この結果を作った後に変わっています。メモを反映させるなら書き直し直してください。</div>` : ""}
    <div class="acts"><button id="fc-regen">もう一度書き直す</button></div>`;
}

function itemPop(id, rect) {
  const cur = () => FC.items.find((x) => x.id === id);
  const it = cur();
  if (!it) return;
  const pop = $("#fc-pop");
  pop.innerHTML = `<div class="k">${itemHead(it, " · 票 ")}</div>
    <div class="quote">「${esc(it.text)}」</div>
    ${it.reason ? `<div class="reason">${esc(it.reason)}</div>` : ""}
    ${it.unit ? `<div class="unit">材料 ${esc(it.unit.id)}: ${esc(it.unit.text)}</div>` : ""}
    ${decisionButtons(it.decision)}
    <textarea id="fc-note" placeholder="書き直すときのメモ（任意）">${esc(it.note)}</textarea>
    <div id="fc-rewrite">${rewriteBlock(it)}</div>
    ${it.kind === "user" ? `<div class="acts"><button id="fc-remove">この項目を消す</button></div>` : ""}`;
  const refresh = () => { const n = cur(); if (n) { pop.querySelector("#fc-rewrite").innerHTML = rewriteBlock(n); bindRewrite(); } };
  const bindRewrite = () => {
    pop.querySelector("#fc-rewrite-text")?.addEventListener("input", (e) => {
      const c = cur(); if (c && c.rewrite) { c.rewrite.result = e.target.value; c.rewrite.source = "user"; saveReview(false); }
    });
    pop.querySelector("#fc-regen")?.addEventListener("click", async () => {
      const c = cur(); if (!c) return;
      c.regenerate = true;
      await saveReview(true);
      refresh();
    });
  };
  const markDecision = (c) => pop.querySelectorAll("button[data-d]").forEach((x) => x.classList.toggle("on", x.dataset.d === c.decision));
  pop.querySelectorAll("button[data-d]").forEach((b) => b.addEventListener("click", async () => {
    const c = cur(); if (!c) return;
    c.decision = b.dataset.d;
    markDecision(c);
    await saveReview(true);
    refresh();
  }));
  pop.querySelector("#fc-note").addEventListener("input", (e) => {
    const c = cur(); if (!c) return;
    c.note = e.target.value;
    if (c.note && !c.decision) { c.decision = "rewrite"; markDecision(c); }
    saveReview(false);
  });
  bindRewrite();
  pop.querySelector("#fc-remove")?.addEventListener("click", () => {
    FC.items = FC.items.filter((x) => x.id !== id);
    FC.removed.push(id);
    pop.hidden = true;
    saveReview(true);
  });
  placeFcPop(pop, rect);
}

function fcSelection() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  if (!$("#fc-article").contains(r.commonAncestorContainer)) return null;
  const a = offsetOf(r.startContainer, r.startOffset), b = offsetOf(r.endContainer, r.endOffset);
  return a !== null && b !== null && a < b ? { start: a, end: b, quote: sel.toString(), rect: r.getBoundingClientRect() } : null;
}

function newItemPop(t) {
  const pop = $("#fc-pop");
  pop.innerHTML = `<div class="k">${esc(kindName("user"))}</div><div class="quote">「${esc(t.quote.slice(0, 120))}」</div>
    ${decisionButtons("")}<textarea id="fc-note" placeholder="書き直すときのメモ（任意）"></textarea>`;
  pop.querySelectorAll("button[data-d]").forEach((b) => b.addEventListener("click", () => {
    FC.items.push({ kind: "user", start: t.start, end: t.end, text: t.quote, decision: b.dataset.d, note: pop.querySelector("#fc-note").value });
    window.getSelection().removeAllRanges();
    pop.hidden = true;
    saveReview(true);
  }));
  placeFcPop(pop, t.rect);
}

function saveReview(now) {
  status("未保存");
  clearTimeout(FC.timer);
  FC.timer = null;
  if (now) return pushReview(true).catch(() => {});
  FC.timer = setTimeout(() => { FC.timer = null; pushReview(false); }, 600);
}

async function pushReview(repaint) {
  status("保存中…");
  try {
    const items = FC.items.map((i) => ({ ...(i.id ? { id: i.id } : {}), decision: i.decision, note: i.note, start: i.start, end: i.end,
      ...(i.rewrite ? { result: i.rewrite.result } : {}), ...(i.regenerate ? { regenerate: true } : {}) }));
    const r = await api(draftPath("review"), { method: "PUT", body: { items, remove: FC.removed } });
    FC.items = r.items; FC.dirty = r.dirty; FC.removed = []; S.version = r.version;
    setApplyEnabled();
    if (repaint) paintFinal(); else renderItems();
    status("保存しました");
  } catch (e) { status("保存できません: " + e.message, true); throw e; }
}

async function applyFinal() {
  try {
    if (FC.timer) { clearTimeout(FC.timer); FC.timer = null; await pushReview(false); }
    status("反映中…");
    const a = await api(draftPath("apply"), { method: "POST", body: {} });
    FC.items = a.review.items; FC.dirty = a.review.dirty; S.version = a.review.version;
    FC.lastApply = a.result; FC.final = a.final;
    FC.finals[FC.draft] = a.result.out;
    const opt = [...$("#fc-draft").options].find((o) => o.value === FC.draft);
    if (opt) opt.textContent = `${FC.draft}（反映済み）`;
    FC.viewing = false;
    await toggleResult();
    showDiff();
    status("反映しました: " + a.result.out + "（結果を表示しています。決定を変えるときは「下書きに戻る」）");
  } catch (e) { status("反映できません: " + e.message, true); }
}

function showDiff() {
  const r = FC.lastApply;
  if (!r) return;
  const box = $("#fc-diff");
  const cls = { "+": "add", "-": "del", " ": "same" };
  box.innerHTML = `<div class="head"><div><h2>${esc(FC.draft)} → ${esc(r.out)}</h2><p class="note">削った ${r.deleted} · 書き直した ${r.rewritten}（固定の結果を使った ${r.reused}）` +
    `${r.skipped.length ? ` · 反映しなかった ${r.skipped.length}（コードの中、または答えが無い）` : ""}` +
    `${r.stale.length ? ` · 下書きが変わったので反映しなかった ${r.stale.length}` : ""} · 呼び出し ${r.calls}</p></div>` +
    `<button id="fc-diff-close">閉じる</button></div>` +
    `<div class="body"><pre>${r.diff.filter(([t]) => t !== " ").map(([t, l]) => `<span class="${cls[t]}">${esc(t)} ${esc(l) || " "}</span>`).join("") || "変更はありません"}</pre></div>`;
  $("#fc-diff-close").addEventListener("click", () => box.close());
  box.onclick = (e) => { if (e.target === box) box.close(); };
  box.showModal();
}

$("#confirm-btn").addEventListener("click", confirmStage);
document.addEventListener("input", () => { S.lastInput = Date.now(); });
$("#fc-draft").addEventListener("change", (e) => loadDraft(e.target.value).catch((err) => status("読み込めません: " + err.message, true)));
$("#fc-apply").addEventListener("click", applyFinal);
$("#fc-article").addEventListener("mouseup", () => setTimeout(() => { if (FC.viewing) return; const t = fcSelection(); if (t) newItemPop(t); }, 0));
document.addEventListener("mousedown", (e) => { const pop = $("#fc-pop"); if (!pop.hidden && !pop.contains(e.target) && !e.target.closest("mark.fc, .fc-item")) pop.hidden = true; });
boot();
</script>
</body>
</html>
