<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="kumimasu-token" content="{{KUMIMASU_TOKEN}}">
<title>記事の設計</title>
<style>
:root {
  --bg: #f5f4f1; --surface: #fbfbf9; --field: #fdfdfb; --fill: #ebe9e4; --line: #dcd9d2; --line-soft: #e7e5e0;
  --ink: #2c2c2a; --ink-2: #5d5b56; --ink-3: #85827c;
  --accent: #46677a; --on-accent: #fbfbf9;
  --sage: #6b8a6f; --sage-text: #4b6a50; --ochre: #a07b28; --ochre-text: #84651f; --brick: #a5524a; --stone: #a19e97;
  --no: var(--sage); --partial: var(--ochre); --yes: var(--stone); --answer: var(--accent);
  --ok: var(--sage); --bad: var(--brick); --code-bg: #efede8;
  --k-meta: #a8812b; --k-glue: #8a6b9b; --k-lint: #8a8781; --k-drop: #b45a49; --k-fabrication: #8e3c4e;
  --k-number: #4a7795; --k-link: #3b827c; --k-user: #5f8655; --k-reader: #b0663a; --k-form: #5d7f8f; --k-caveat: #957a5c; --k-flow: #6f7f4f;
  --pop-shadow: 0 10px 30px rgb(40 38 34 / .09);
  --font: "Avenir Next", "Segoe UI Variable Text", "Segoe UI", "Helvetica Neue", "Hiragino Sans", "Hiragino Kaku Gothic ProN",
    "Noto Sans JP", "Noto Sans CJK JP", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Code", "Menlo", "Consolas", "Noto Sans Mono CJK JP", monospace;
  --t-s: 12.5px; --t-m: 14.5px; --t-l: 17px; --t-xl: 22px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --gutter: 40px; --r: 6px; --r-l: 10px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d1e1c; --surface: #242523; --field: #222321; --fill: #2f302d; --line: #3b3c38; --line-soft: #2f302c;
    --ink: #e6e3dc; --ink-2: #aeaaa2; --ink-3: #8a867e;
    --accent: #93b2c4; --on-accent: #1a2125;
    --sage: #94b396; --sage-text: #a6c3a7; --ochre: #d0ae66; --ochre-text: #d8b977; --brick: #d98f84; --stone: #77746e;
    --code-bg: #282926;
    --k-meta: #d4ae5e; --k-glue: #b9a0cb; --k-lint: #a29e96; --k-drop: #e0947f; --k-fabrication: #d98b9c;
    --k-number: #8fb5cf; --k-link: #7fbfb6; --k-user: #9cbf8e; --k-reader: #e0a47c; --k-form: #9cc0cf; --k-caveat: #cdb393; --k-flow: #b3c18f;
    --pop-shadow: 0 10px 30px rgb(0 0 0 / .35);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: var(--t-m); line-height: 1.75;
  -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); text-underline-offset: 2px; }
code { font-family: var(--mono); font-size: .9em; }
h2 { font-size: var(--t-l); font-weight: 600; margin: 0 0 var(--s3); letter-spacing: .01em; }
h3 { font-size: var(--t-m); font-weight: 600; margin: var(--s6) 0 var(--s3); color: var(--ink); }
label, .label { display: block; font-size: var(--t-s); color: var(--ink-2); margin: 0 0 var(--s1); }
.note, .hint { color: var(--ink-3); font-size: var(--t-s); margin: 0; }
.hint { margin: -2px 0 var(--s2); line-height: 1.6; }
textarea, input[type=text], input[type=number], input:not([type]), select {
  width: 100%; border: 1px solid var(--line); border-radius: var(--r); background: var(--field); padding: 7px 10px; line-height: 1.6; }
textarea { min-height: 72px; resize: vertical; display: block; }
textarea:focus, input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
select { width: auto; padding: 4px 8px; }

.btn { border: 1px solid var(--line); background: transparent; border-radius: var(--r); padding: 4px 12px; font-size: var(--t-s); color: var(--ink-2); }
.btn:hover:not(:disabled) { background: var(--fill); color: var(--ink); }
.btn.quiet { border-color: transparent; }
.primary { border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); border-radius: var(--r); padding: 8px 18px;
  font-size: var(--t-m); font-weight: 600; white-space: nowrap; }
.primary:hover:not(:disabled) { filter: brightness(1.08); }
.primary:disabled { background: transparent; color: var(--ink-3); border-color: var(--line); }

.seg { display: inline-flex; background: var(--fill); border-radius: 8px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 6px; padding: 2px 10px; font-size: var(--t-s); color: var(--ink-2); }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.seg button.on[data-use="deep"], .seg button.on[data-d="keep"] { color: var(--sage-text); }
.seg button.on[data-use="drop"], .seg button.on[data-d="delete"] { color: var(--brick); }
.seg button.on[data-d="rewrite"] { color: var(--accent); }
.toggle { border: 0; background: transparent; border-radius: 999px; padding: 1px 10px; font-size: var(--t-s); color: var(--ink-3); }
.toggle:hover { color: var(--ink); background: var(--fill); }
.toggle.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, transparent); font-weight: 600; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px; flex: none; }

header { padding: var(--s6) var(--gutter) 0; }
header h1 { font-size: var(--t-xl); font-weight: 600; line-height: 1.4; margin: 0; letter-spacing: .01em; }
.meta { display: flex; flex-wrap: wrap; gap: 2px var(--s4); color: var(--ink-3); font-size: var(--t-s); margin-top: var(--s1); }
.stages { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0 var(--s5); margin-top: var(--s5); border-bottom: 1px solid var(--line); }
.stages button { border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; padding: var(--s2) 0; font-size: 13.5px; color: var(--ink-2); }
.stages button .n { color: var(--ink-3); margin-right: 6px; font-variant-numeric: tabular-nums; }
.stages button:hover:not(:disabled) { color: var(--ink); }
.stages button.on { color: var(--ink); border-bottom-color: var(--ink-3); }
.stages button.cur { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.stages button:disabled { color: var(--ink-3); opacity: .6; }
.ro-banner { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s1) var(--s3); overflow-wrap: anywhere; margin: 0 var(--gutter); padding: var(--s3) 0; font-size: var(--t-s); color: var(--ink-2); border-bottom: 1px solid var(--line-soft); }
.ro-banner .btn { padding: 0 8px; color: var(--accent); }
.restart-dlg { width: min(560px, calc(100vw - 32px)); }
.restart-dlg form { margin: 0; }
.restart-dlg fieldset { border: 0; margin: 0 0 var(--s4); padding: 0; }
.restart-dlg legend { padding: 0; }
.restart-dlg .mode { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 var(--s3); align-items: baseline; margin: 0 0 var(--s2); padding: var(--s3); border: 1px solid var(--line); border-radius: var(--r); font-size: var(--t-m); color: var(--ink); cursor: pointer; }
.restart-dlg .mode:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.restart-dlg .mode input { accent-color: var(--accent); margin: 0; }
.restart-dlg .mode b { font-weight: 600; }
.restart-dlg .mode .note { grid-column: 2; }
.restart-dlg .acts { display: flex; justify-content: flex-end; align-items: center; gap: var(--s3); margin-top: var(--s4); }
.restart-dlg .warn-box:empty { display: none; }

main { flex: 1; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 420px); gap: var(--s7); padding: var(--s6) var(--gutter) var(--s7); max-width: 1440px; margin: 0 auto; }
.side { position: sticky; top: var(--s4); align-self: start; max-height: calc(100vh - 120px); overflow: auto; padding: 0 var(--s1) var(--s5) 0; }
.side section + section { margin-top: var(--s7); }
.legend { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); color: var(--ink-2); font-size: var(--t-s); margin-bottom: var(--s4); }
.legend span { display: inline-flex; align-items: center; }
.filters { display: flex; flex-wrap: wrap; gap: var(--s1); margin-bottom: var(--s2); }
.filters button { border: 0; background: transparent; border-radius: 999px; padding: 2px 12px; font-size: var(--t-s); color: var(--ink-2); }
.filters button:hover { color: var(--ink); }
.filters button.on { background: var(--fill); color: var(--ink); font-weight: 600; }
.filters button .c { color: var(--ink-3); font-weight: 400; margin-left: 5px; font-variant-numeric: tabular-nums; }
.filters .sep { width: 1px; align-self: stretch; margin: 4px var(--s2); background: var(--line); }
.unit.flash { background: color-mix(in srgb, var(--accent) 9%, transparent); box-shadow: -12px 0 0 color-mix(in srgb, var(--accent) 9%, transparent), 12px 0 0 color-mix(in srgb, var(--accent) 9%, transparent); transition: background .6s, box-shadow .6s; }

.unit { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s2) var(--s5); padding: var(--s4) 0; border-top: 1px solid var(--line-soft); }
.unit .head { display: flex; flex-wrap: wrap; align-items: center; gap: 0 var(--s3); font-size: var(--t-s); color: var(--ink-3); margin-bottom: 2px; }
.unit .head .id { color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.unit .why { color: var(--ink-2); font-size: var(--t-s); }
.unit .text { white-space: pre-wrap; overflow-wrap: anywhere; }
.unit pre { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; background: var(--code-bg); border-radius: var(--r); padding: var(--s2) var(--s3); margin: var(--s1) 0 0; overflow-x: auto; white-space: pre; }
.unit.drop .text, .unit.drop pre { opacity: .45; }
.tools { display: flex; flex-direction: column; align-items: flex-end; gap: var(--s1); }
.tools .toggles { display: flex; gap: 2px; }

.q { margin: 0 0 var(--s5); }
.q .qt { font-weight: 600; margin-bottom: 2px; }
.q .why { color: var(--ink-2); font-size: var(--t-s); }
.refs { color: var(--ink-3); font-size: var(--t-s); font-variant-numeric: tabular-nums; }
.q .ctx { color: var(--ink-2); font-size: var(--t-s); margin: 2px 0 0; }
.q .refline { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1); margin: var(--s1) 0 var(--s2); }
.q .why { color: var(--ink-3); }
.ref { border: 0; background: transparent; color: var(--accent); font-size: var(--t-s); font-variant-numeric: tabular-nums; padding: 0 5px; border-radius: 4px;
  text-decoration: underline dotted; text-underline-offset: 3px; line-height: 1.6; }
.ref:hover, .ref.on { background: color-mix(in srgb, var(--accent) 12%, transparent); text-decoration-style: solid; }
.ref-pop .head { display: flex; flex-wrap: wrap; align-items: center; gap: 0 var(--s3); color: var(--ink-3); font-size: var(--t-s); }
.ref-pop .head .id { color: var(--ink-2); font-weight: 600; }
.ref-pop .text { white-space: pre-wrap; overflow-wrap: anywhere; margin: var(--s1) 0 0; max-height: 40vh; overflow: auto; }
.ref-pop pre { font-family: var(--mono); font-size: 12px; line-height: 1.6; background: var(--code-bg); border-radius: var(--r); padding: var(--s2) var(--s3); margin: var(--s1) 0 0; overflow: auto; max-height: 40vh; }
.ref-pop .acts { display: flex; justify-content: flex-end; margin-top: var(--s2); }
.field { margin-bottom: var(--s4); }
.counts { display: flex; flex-wrap: wrap; gap: 0 var(--s4); font-size: var(--t-s); color: var(--ink-3); margin-top: var(--s2); font-variant-numeric: tabular-nums; }
.length { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.length input { width: 120px; }
.noise { display: flex; gap: var(--s3); align-items: center; margin: var(--s1) 0; }
.noise input { flex: 1; min-width: 0; padding: 4px 8px; }
.noise .tx { flex: 0 1 auto; max-width: 55%; min-width: 0; color: var(--ink-3); font-size: var(--t-s); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toggle:disabled { opacity: .55; }
.conflicts { list-style: none; margin: var(--s2) 0 0; padding: 0; }
.conflicts li { padding: var(--s2) 0 var(--s2) var(--s3); border-left: 2px solid var(--ochre); margin-bottom: var(--s2); }
.conflicts .what { overflow-wrap: anywhere; }
.conflicts .lv { color: var(--ochre-text); font-size: var(--t-s); margin-left: var(--s2); white-space: nowrap; }
.conflicts .refline { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1); color: var(--ink-3); font-size: var(--t-s); }
.rule { display: flex; gap: var(--s2); align-items: center; margin: 2px 0; }
.rule input[type=text] { flex: 1; min-width: 0; padding: 4px 8px; border-color: transparent; background: transparent; }
.rule input[type=text]:hover { border-color: var(--line); }
.rule input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.rule.off input[type=text] { color: var(--ink-3); text-decoration: line-through; }
.rule button { border: 0; background: transparent; color: var(--ink-3); border-radius: var(--r); padding: 0 8px; font-size: 16px; line-height: 1.6; }
.rule button:hover { color: var(--brick); background: var(--fill); }
.add { margin-top: var(--s2); }
#conflicts:not(:empty), #terms:not(:empty) { margin-bottom: var(--s4); }
.load { margin-top: var(--s3); font-size: var(--t-s); color: var(--ink-2); }
.load .sum { display: flex; flex-wrap: wrap; gap: 0 var(--s3); font-variant-numeric: tabular-nums; }
.load .sum b { color: var(--ink); font-weight: 600; }
.load.over .sum b { color: var(--ochre-text); }
.meter { position: relative; height: 4px; border-radius: 2px; background: var(--fill); margin: var(--s2) 0 var(--s1); }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: var(--sage); }
.load.over .meter i { background: var(--ochre); }
.meter s { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); }
.advice { margin: var(--s3) 0 0; padding: var(--s1) 0 var(--s1) var(--s3); border-left: 2px solid var(--ochre); }
.advice p { margin: 0 0 var(--s1); }
.advice ul { list-style: none; margin: 0; padding: 0; }
.advice li { display: flex; align-items: baseline; gap: var(--s2); padding: 2px 0; }
.advice li .tx { flex: 1; min-width: 0; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.advice li .btn, .terms .btn { padding: 0 8px; white-space: nowrap; }
.advice .acts { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s2); }
.terms { list-style: none; margin: var(--s2) 0 0; padding: 0; }
.terms li { padding: var(--s2) 0 var(--s2) var(--s3); border-left: 2px solid var(--line); margin-bottom: var(--s2); }
.terms li.dropped { border-left-color: var(--ochre); }
.terms li.missing { border-left-color: var(--k-reader); }
.terms .what { overflow-wrap: anywhere; }
.terms .what b { font-weight: 600; }
.terms .lv { color: var(--ink-3); font-size: var(--t-s); margin-left: var(--s2); white-space: nowrap; }
.terms li.dropped .lv { color: var(--ochre-text); }
.terms li.missing .lv { color: var(--k-reader); }
.terms .refline { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1); color: var(--ink-3); font-size: var(--t-s); }
.unit .head .promoted { color: var(--accent); }
.unit .head .path { overflow-wrap: anywhere; }
.unit .head .orig { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0 2px; }
.digest-note { margin: 0 0 var(--s4); padding: var(--s2) 0 var(--s2) var(--s3); border-left: 2px solid var(--accent); font-size: var(--t-s); color: var(--ink-2); }
.digest-note p { margin: 0 0 var(--s1); }
.digest-note p:last-child { margin-bottom: 0; }
.digest-note b { color: var(--ink); font-weight: 600; }
.digest-note ul { margin: 0 0 var(--s1); padding-left: 1.2em; }
.ref-pop .origs { margin-top: var(--s3); padding-top: var(--s2); border-top: 1px solid var(--line-soft); }
.ref-pop .origs .o { margin: var(--s2) 0 0; }
.ref-pop .origs .o .text { max-height: 18vh; color: var(--ink-2); font-size: var(--t-s); }

#foot { position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s5);
  padding: var(--s3) var(--gutter); background: var(--bg); border-top: 1px solid var(--line); }
#status { font-size: var(--t-s); color: var(--ink-3); min-width: 8em; }
#status.err { color: var(--brick); }
.confirm-bar { flex: 1; display: flex; gap: var(--s3); align-items: center; min-width: 0; }
.confirm-bar textarea { flex: 1; min-width: 0; min-height: 40px; height: 40px; max-height: 140px; }

.drafting { max-width: 36em; margin: 12vh auto; padding: 0 var(--gutter); }
.drafting h2 { display: flex; align-items: center; gap: var(--s3); }
.drafting .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: breathe 2.4s ease-in-out infinite; }
.drafting p { color: var(--ink-2); }
.drafting .steps { list-style: none; margin: var(--s5) 0; padding: 0; }
.drafting .steps li { display: flex; align-items: center; gap: var(--s3); padding: 3px 0; color: var(--ink-3); font-size: var(--t-s); }
.drafting .steps li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line); flex: none; }
.drafting .steps li.done { color: var(--ink-2); }
.drafting .steps li.done::before { background: var(--sage); box-shadow: none; }
.drafting .steps li.now { color: var(--ink); font-weight: 600; }
.drafting .steps li.now::before { background: var(--accent); box-shadow: none; animation: breathe 2.4s ease-in-out infinite; }
.drafting .pulse.still { animation: none; background: var(--sage); }
#wait-note:not(:empty) { margin-top: var(--s5); padding-top: var(--s3); border-top: 1px solid var(--line-soft); }
@keyframes breathe { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .drafting .pulse, .drafting .steps li.now::before { animation: none; } }

.fc-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3) var(--s4); padding: var(--s5) var(--gutter) 0; max-width: 1440px; margin: 0 auto; }
.fc-bar .inline { display: inline-flex; align-items: center; gap: var(--s2); margin: 0; font-size: var(--t-s); color: var(--ink-2); }
.fc-bar .primary { margin-left: auto; }
.fc-result { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s2); padding: var(--s3) var(--gutter) 0; max-width: 1440px; margin: 0 auto; font-size: var(--t-s); color: var(--ink-2); }
.fc-result .what { margin-right: var(--s3); }
.fc-result .what b { color: var(--ink); font-weight: 600; }
.fc-result .result-note { flex-basis: 100%; }
.fc-result textarea { flex-basis: 100%; min-height: 160px; font-family: var(--mono); font-size: 12px; }
.fc-used { max-width: 1440px; margin: 0 auto; padding: var(--s2) var(--gutter) 0; font-size: var(--t-s); color: var(--ink-2); }
.fc-used summary { cursor: pointer; color: var(--ink-3); width: fit-content; }
.fc-used summary:hover { color: var(--ink); }
.fc-used > div { padding: var(--s2) 0 var(--s3); max-width: 60em; }
.fc-used h4 { font-size: var(--t-s); font-weight: 600; color: var(--ink); margin: var(--s3) 0 2px; }
.fc-used ul { margin: 0; padding-left: 1.3em; }
.fc-used p { margin: 2px 0; }
.fc-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); gap: var(--s7); padding: var(--s5) var(--gutter) var(--s7); max-width: 1440px; margin: 0 auto; }

.fc-article { font-size: var(--t-l); line-height: 1.95; max-width: 38em; overflow-wrap: anywhere; }
.fc-article h1, .fc-article h2 { font-size: 1.4em; font-weight: 600; line-height: 1.5; margin: 1.8em 0 .7em; }
.fc-article h3 { font-size: 1.16em; font-weight: 600; line-height: 1.55; margin: 1.8em 0 .5em; }
.fc-article h4, .fc-article h5, .fc-article h6 { font-size: 1em; font-weight: 600; margin: 1.5em 0 .4em; }
.fc-article > :first-child, .fc-article > section:first-child > :first-child { margin-top: 0; }
.fc-article p { margin: 0 0 1.1em; }
.fc-article ul, .fc-article ol { padding-left: 1.4em; margin: 0 0 1.1em; }
.fc-article code { background: var(--code-bg); border-radius: 4px; padding: .05em .3em; font-size: .86em; }
.fc-article pre { font-family: var(--mono); font-size: 13px; line-height: 1.65; background: var(--code-bg); border-radius: var(--r-l); padding: var(--s3) var(--s4); overflow-x: auto; }
.fc-article pre code { background: none; padding: 0; }
.fc-article table { border-collapse: collapse; font-size: .9em; display: block; overflow-x: auto; margin: 0 0 1.1em; }
.fc-article th, .fc-article td { border-bottom: 1px solid var(--line); padding: .35em .8em .35em 0; text-align: left; }
.fc-article .img-ph { display: block; border: 1px dashed var(--line); border-radius: var(--r-l); padding: 1em; text-align: center; color: var(--ink-3); font-size: var(--t-s); }
.fc-article > .note { margin-bottom: var(--s5); }
.fig-ph { display: block; margin: 0 0 1.1em; padding: .9em 1em; border: 1px dashed color-mix(in srgb, var(--accent) 55%, var(--line)); border-radius: var(--r-l);
  background: color-mix(in srgb, var(--accent) 5%, transparent); color: var(--ink-2); font-size: var(--t-s); line-height: 1.7; }
.fig-ph b { display: inline-block; margin-right: var(--s2); padding: 0 7px; border-radius: 999px; font-weight: 600; font-size: 11.5px; color: var(--accent); box-shadow: inset 0 0 0 1px currentColor; }
.fig-ph.inline { display: inline; margin: 0 2px; padding: 1px 6px; border-radius: var(--r); }
.fig-ph.flash { outline: 2px solid var(--accent); outline-offset: 2px; }
.fc-figs { margin: 0 0 var(--s4); padding: var(--s2) 0 var(--s2) var(--s3); border-left: 2px solid var(--accent); font-size: var(--t-s); color: var(--ink-2); }
.fc-figs .label { margin-bottom: 2px; }
.fc-figs button { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: var(--r); padding: var(--s1) var(--s2); margin: 0 calc(-1 * var(--s2)); color: var(--ink); font-size: 13px; line-height: 1.6; }
.fc-figs button:hover { background: var(--fill); }
.fc-figs button span { display: block; color: var(--ink-3); font-size: var(--t-s); }
mark.fc { background: color-mix(in srgb, var(--c) 17%, transparent); color: inherit; border-bottom: 2px solid var(--c); cursor: pointer; border-radius: 2px; }
mark.fc:hover { background: color-mix(in srgb, var(--c) 28%, transparent); }
mark.fc.keep { background: transparent; border-bottom-style: dotted; }
mark.fc.delete { text-decoration: line-through; text-decoration-color: var(--brick); text-decoration-thickness: 1.5px; opacity: .6; }
mark.fc.rewrite { border-bottom-style: dashed; }
mark.fc.focus { outline: 2px solid var(--c); outline-offset: 2px; }
mark.chg { background: color-mix(in srgb, var(--sage) 20%, transparent); border-bottom: 2px solid var(--sage); border-radius: 2px; color: inherit; cursor: help; }
.chg-del { display: inline-block; font-size: 11px; line-height: 1; padding: 2px 5px; margin: 0 2px; border-radius: 4px; color: var(--brick); border: 1px solid currentColor; cursor: help; vertical-align: middle; }

.fc-side { position: sticky; top: var(--s4); align-self: start; max-height: calc(100vh - 120px); overflow: auto; padding-right: var(--s1); }
.fc-side .side-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s2); }
.fc-side .side-head h2 { margin: 0; }
.fc-count { font-size: var(--t-s); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.fc-legend { display: flex; flex-wrap: wrap; gap: 2px var(--s4); font-size: var(--t-s); color: var(--ink-2); margin-bottom: var(--s3); }
.fc-legend span { display: inline-flex; align-items: center; }
.fc-item { padding: var(--s3) var(--s2); margin: 0 calc(-1 * var(--s2)); border-top: 1px solid var(--line-soft); border-radius: var(--r); cursor: pointer; }
.fc-item:hover { background: var(--fill); }
.fc-item .k { display: flex; flex-wrap: wrap; align-items: center; gap: 0 var(--s2); font-size: var(--t-s); color: var(--ink-3); }
.fc-item .k .kind { color: var(--ink-2); }
.fc-item .t { font-size: 13.5px; line-height: 1.65; overflow-wrap: anywhere; margin: 2px 0 var(--s1); }
.fc-item .d { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s2); font-size: var(--t-s); color: var(--ink-2); }
.fc-item.done .t { color: var(--ink-2); }
.dec { display: inline-block; border-radius: 999px; padding: 0 9px; font-size: 12px; font-weight: 600; line-height: 1.7; }
.dec-none { color: var(--ink-3); font-weight: 400; box-shadow: inset 0 0 0 1px var(--line); }
.dec-keep { color: var(--sage-text); background: color-mix(in srgb, var(--sage) 16%, transparent); }
.dec-delete { color: var(--brick); background: color-mix(in srgb, var(--brick) 13%, transparent); }
.dec-rewrite { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.badge { display: inline-block; font-size: 11.5px; border-radius: 999px; padding: 0 7px; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); }
.badge.bad { color: var(--brick); box-shadow: inset 0 0 0 1px currentColor; }
.warn-box { color: var(--brick); font-size: var(--t-s); margin: var(--s2) 0; }

.fc-pop { position: absolute; z-index: 10; width: min(420px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l);
  box-shadow: var(--pop-shadow); padding: var(--s4); font-size: 13.5px; line-height: 1.7; }
.fc-pop .k { display: flex; flex-wrap: wrap; gap: 0 var(--s2); align-items: center; color: var(--ink-3); font-size: var(--t-s); }
.fc-pop .k .kind { color: var(--ink-2); font-weight: 600; }
.fc-pop .quote { margin: var(--s1) 0 var(--s2); overflow-wrap: anywhere; }
.fc-pop .reason, .fc-pop .unit { display: block; color: var(--ink-2); font-size: var(--t-s); margin: var(--s1) 0; padding: 0; border: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.fc-pop .acts { display: flex; gap: var(--s2); margin: var(--s3) 0 var(--s2); flex-wrap: wrap; }
.fc-pop textarea { min-height: 56px; }
.fc-pop label { margin-top: var(--s3); }

.fc-diff { border: 1px solid var(--line); border-radius: var(--r-l); background: var(--surface); color: var(--ink); padding: 0; width: min(900px, calc(100vw - 32px)); max-height: calc(100vh - 64px); box-shadow: var(--pop-shadow); }
.fc-diff::backdrop { background: rgb(20 20 18 / .3); }
.fc-diff .head { position: sticky; top: 0; background: var(--surface); padding: var(--s4) var(--s5) var(--s3); border-bottom: 1px solid var(--line-soft); display: flex; gap: var(--s3); align-items: flex-start; }
.fc-diff .head > div { flex: 1; min-width: 0; }
.fc-diff .head h2 { margin: 0 0 2px; font-size: var(--t-m); overflow-wrap: anywhere; }
.fc-diff .body { padding: var(--s3) var(--s5) var(--s5); overflow: auto; }
.fc-diff pre { font-family: var(--mono); font-size: 12.5px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.fc-diff .add { background: color-mix(in srgb, var(--sage) 16%, transparent); display: block; padding: 0 var(--s2); border-radius: 3px; }
.fc-diff .del { background: color-mix(in srgb, var(--brick) 13%, transparent); display: block; padding: 0 var(--s2); border-radius: 3px; text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--brick) 60%, transparent); }
.fc-diff .same { color: var(--ink-3); display: block; }

@media (max-width: 960px) {
  :root { --gutter: 20px; }
  .layout, .fc-grid { grid-template-columns: minmax(0, 1fr); gap: var(--s6); }
  .side, .fc-side { position: static; max-height: none; overflow: visible; }
  .side { border-top: 1px solid var(--line); padding-top: var(--s5); }
  .fc-side { border-top: 1px solid var(--line); padding-top: var(--s4); }
}
@media (max-width: 600px) {
  :root { --gutter: 16px; --t-xl: 19px; --t-l: 16px; }
  header { padding-top: var(--s5); }
  .stages { gap: 0 var(--s4); }
  .stages button { font-size: 13px; }
  .stages button .n { display: none; }
  .unit { grid-template-columns: minmax(0, 1fr); }
  .tools { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: flex-start; }
  #foot { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "note note" "status btn"; gap: var(--s2) var(--s3); padding: var(--s2) var(--gutter); }
  .confirm-bar { display: contents; }
  .confirm-bar textarea { grid-area: note; }
  .confirm-bar .primary { grid-area: btn; padding: 7px 14px; font-size: 13.5px; }
  #status { grid-area: status; min-width: 0; line-height: 1.4; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .fc-bar .primary { margin-left: 0; }
  .fc-result .what { flex-basis: 100%; }
}
</style>
</head>
<body>
<header><h1 id="topic">…</h1><div class="meta" id="meta"></div>
  <nav class="stages" id="stages" aria-label="段階"></nav></header>
<div id="ro-banner" class="ro-banner" hidden></div>
<main>
<div class="layout" id="view-design">
  <section>
    <h2>材料</h2>
    <div id="digest-note" class="digest-note" hidden></div>
    <div class="legend">
      <span><i class="dot" style="--c: var(--no)"></i>手元だけ</span>
      <span><i class="dot" style="--c: var(--partial)"></i>一部は検索で届く</span>
      <span><i class="dot" style="--c: var(--yes)"></i>検索で届く</span>
      <span><i class="dot" style="--c: var(--answer)"></i>インタビューの回答</span>
    </div>
    <div class="filters" id="filters"></div>
    <div id="units"></div>
  </section>
  <aside class="side">
    <section id="interview"><h2>インタビュー</h2></section>
    <section id="design"><h2>設計</h2></section>
  </aside>
</div>
<div id="view-wait" class="drafting" hidden aria-live="polite">
  <h2><i class="pulse" id="wait-pulse"></i><span id="wait-title"></span></h2>
  <p id="wait-detail"></p>
  <ol class="steps" id="wait-steps"></ol>
  <p class="note" id="wait-next"></p>
  <div id="wait-note"></div>
  <div id="wait-digest" class="digest-note" hidden></div>
</div>
<div id="view-final" hidden>
  <div class="fc-bar">
    <label class="inline">下書き <select id="fc-draft"></select></label>
    <button id="fc-apply" class="primary">反映</button>
  </div>
  <div class="fc-result" id="fc-result" hidden></div>
  <details class="fc-used" id="fc-used" hidden><summary>この下書きに使った設定</summary><div id="fc-used-body"></div></details>
  <div class="fc-grid">
    <article id="fc-article" class="fc-article"></article>
    <aside class="fc-side">
      <div id="fc-figs" class="fc-figs" hidden></div>
      <div class="side-head"><h2>指摘</h2><span class="fc-count" id="fc-count"></span></div>
      <div class="fc-legend" id="fc-legend"></div>
      <div id="fc-items"></div>
    </aside>
  </div>
  <dialog class="fc-diff" id="fc-diff"></dialog>
</div>
</main>
<dialog class="fc-diff restart-dlg" id="restart-dlg" aria-labelledby="restart-title"></dialog>
<div id="fc-pop" class="fc-pop" hidden></div>
<div id="ref-pop" class="fc-pop ref-pop" role="dialog" aria-label="参考の材料" hidden></div>
<footer id="foot">
  <div id="status" role="status">読み込み中</div>
  <div id="confirm-bar" class="confirm-bar" hidden>
    <textarea id="confirm-note" rows="1" aria-label="エージェントへの指示" placeholder="エージェントへの指示（任意）"></textarea>
    <button id="confirm-btn" class="primary">確定してエージェントに渡す</button>
  </div>
</footer>
<script>
const S = { data: null, filter: "all", timers: {}, version: "", viewing: null, lastInput: 0, unitsKey: "" };
const FC = { draft: null, html: "", items: [], removed: [], table: [], timer: null, finals: {}, final: null,
  viewing: false, dirty: false, lastApply: null };
const COLOR = { yes: "var(--yes)", partial: "var(--partial)", no: "var(--no)", null: "var(--line)" };
const FILTERS = { all: "すべて", firsthand: "手元だけ・回答", searchable: "検索で届く" };
const USE_FILTERS = { write: "書く", deep: "掘り下げる", mention: "触れる", drop: "書かない" };
const TOKEN = document.querySelector('meta[name="kumimasu-token"]').content;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const linkify = (s) => esc(s).replace(/https?:\/\/[^\s)<>\]」』]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
const L = () => S.data.labels;
const kindName = (k) => L().kind[k] || k;
const kindColor = (k) => (k in L().kind ? `var(--k-${k})` : "var(--k-lint)");

function status(msg, err) { const n = $("#status"); n.textContent = msg; n.title = msg; n.className = err ? "err" : ""; }

function request(path, opts = {}) {
  const headers = { "X-Kumimasu-Token": TOKEN, ...(opts.headers || {}) };
  if (opts.body !== undefined) headers["Content-Type"] = "application/json";
  return fetch(path, { ...opts, headers, body: opts.body === undefined ? undefined : JSON.stringify(opts.body) });
}

async function api(path, opts) {
  const r = await request(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

const draftPath = (kind) => `/api/${kind}/${encodeURIComponent(FC.draft)}`;

function useOf(id) {
  const d = S.data.design;
  const u = d && d.units.find((x) => x.id === id);
  return u ? u.use : null;
}

function matches(f, u) {
  switch (f) {
    case "firsthand": return u.firsthand;
    case "searchable": return u.origin === "material" && u.searchable === "yes";
    case "write": return useOf(u.id) === "deep" || useOf(u.id) === "mention";
    case "deep": case "mention": case "drop": return useOf(u.id) === f;
    default: return true;
  }
}

const visible = (u) => matches(S.filter, u);
const unitById = (id) => id.startsWith("raw:") ? S.data.originals[id.slice(4)] : S.data.units.find((u) => u.id === id);
const unitWhere = (u) => u.path || [u.source, u.section].filter(Boolean).join(" / ");
const refs = (ids) => ids.map((i) => `<button type="button" class="ref" data-ref="${esc(i)}" aria-haspopup="dialog">${esc(i)}</button>`).join("");

function renderFilters() {
  if (!S.data.design && S.filter in USE_FILTERS) S.filter = "all";
  const btn = ([k, v]) => `<button data-f="${k}" class="${S.filter === k ? "on" : ""}" aria-pressed="${S.filter === k}">${v}<span class="c">${S.data.units.filter((u) => matches(k, u)).length}</span></button>`;
  const f = $("#filters");
  f.innerHTML = Object.entries(FILTERS).map(btn).join("") +
    (S.data.design ? `<span class="sep" aria-hidden="true"></span>` + Object.entries(USE_FILTERS).map(btn).join("") : "");
  f.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { S.filter = b.dataset.f; renderUnits(); }));
}

function renderUnits() {
  const d = S.data.design;
  S.unitsKey = JSON.stringify([S.filter, S.data.units, d && [d.units, d.skip, d.aside]]);
  renderFilters();
  const box = $("#units");
  box.innerHTML = "";
  const uses = L().use;
  for (const u of S.data.units.filter(visible)) {
    const use = useOf(u.id);
    const color = u.origin === "answer" ? "var(--answer)" : COLOR[u.searchable];
    const tag = u.origin === "answer" ? "回答" : L().searchable[u.searchable];
    const where = unitWhere(u);
    const body = u.kind === "code" ? `<pre>${esc(u.text)}</pre>` : `<div class="text">${linkify(u.text)}</div>`;
    const isSkip = d && d.skip.some((x) => x.units.includes(u.id));
    const isAside = d && d.aside.some((x) => x.id === u.id);
    const lu = d && d.units.find((x) => x.id === u.id);
    const isBare = !!lu && lu.land === "bare";
    const hasNote = !!lu && !!lu.note.trim();
    const land = lu && (use === "deep" || use === "mention") ? `<button data-noise="land" class="toggle${isBare ? " on" : ""}" aria-pressed="${isBare}"${hasNote ? " disabled" : ""} title="${hasNote ? "一言があるので、一言の範囲で解釈・感想を書く（一言を消すと切り替えられる）" : "結果を述べたら、意味づけ・教訓・効用を足さずに次へ進む"}">結果だけ</button>` : "";
    const seg = use ? `<div class="tools"><div class="seg" role="group" aria-label="使い方">${Object.keys(uses).map((x) =>
      `<button data-use="${x}" class="${x === use ? "on" : ""}" aria-pressed="${x === use}">${uses[x]}</button>`).join("")}</div>
      <div class="toggles"><button data-noise="skip" class="toggle${isSkip ? " on" : ""}" aria-pressed="${isSkip}" title="説明しない前提にする（書かない）">前提扱い</button>` +
      `<button data-noise="aside" class="toggle${isAside ? " on" : ""}" aria-pressed="${isAside}" title="脱線として入れる">脱線</button>${land}</div></div>` : "";
    const row = document.createElement("div");
    row.className = "unit" + (use === "drop" ? " drop" : "");
    row.id = `unit-${u.id}`;
    const same = u.members && u.members.length ? `<span>同じ内容: ${u.members.map(esc).join(", ")}</span>` : "";
    const orig = u.origin === "digest" && u.from && u.from.length && S.data.originals[u.from[0]] ? `<span class="orig">元${origRefs(u.from)}</span>` : "";
    const promoted = d && use !== "drop" ? d.units.find((x) => x.id === u.id && x.promoted_for) : null;
    const pr = promoted ? `<span class="promoted">用語「${esc(promoted.promoted_for)}」の説明として触れる</span>` : "";
    const ctx = u.context ? `<div class="why">問い: ${esc(u.context)}</div>` : "";
    row.innerHTML = `<div><div class="head"><span class="id">${esc(u.id)}</span><span><i class="dot" style="--c: ${color}"></i>${esc(tag)}</span>${where ? `<span class="path">${esc(where)}</span>` : ""}${orig}${same}${pr}</div>${ctx}${body}</div>${seg}`;
    row.querySelectorAll("button[data-use]").forEach((b) => b.addEventListener("click", () => save("/api/design", { units: { [u.id]: b.dataset.use } }, true)));
    row.querySelector("button[data-noise=skip]")?.addEventListener("click", () =>
      save("/api/design", { toggle_skip: { unit: u.id, on: !isSkip } }, true));
    row.querySelector("button[data-noise=aside]")?.addEventListener("click", () =>
      save("/api/design", { toggle_aside: { unit: u.id, on: !isAside } }, true));
    row.querySelector("button[data-noise=land]")?.addEventListener("click", () =>
      save("/api/design", { land: { [u.id]: isBare ? "author" : "bare" } }, true));
    box.appendChild(row);
  }
  if (!box.children.length) box.innerHTML = `<p class="note">該当する単位はありません。</p>`;
}

const origRefs = (ids, n = 6) => ids.slice(0, n).map((i) => `<button type="button" class="ref" data-ref="raw:${esc(i)}" aria-haspopup="dialog" title="digest 前の単位">${esc(i)}</button>`).join("") + (ids.length > n ? `<span>ほか ${ids.length - n}</span>` : "");

function renderDigest() {
  const boxes = [$("#digest-note"), $("#wait-digest")];
  const dg = S.data.project.digest;
  const show = S.viewing === "interview" || S.viewing === "design";
  const html = !dg || !show || (!dg.recommended && !dg.done_at) ? "" : digestHtml(dg);
  boxes.forEach((b) => { b.hidden = !html; b.innerHTML = html; });
}

function digestHtml(dg) {
  if (dg.done_at) {
    return `<p><b>材料は自己完結したメモに書き直してあります</b>（digest、${num(dg.units_before)} 単位 → ${num(dg.units_after)} 単位）。各単位の「元」から、書き直す前の単位を見られます。</p>`;
  }
  return `<p><b>材料が、仕上がった文書のようです。</b>文書から切り出した単位は、見出しや前後の文が無いと何の話か分かりにくくなります。</p>
    <ul>${dg.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>
    <p>エージェントに頼むと、目印付けとインタビューの前に、節ごとに自己完結したメモへ書き直せます（<code>kumimasu digest DIR</code>。任意で、節ごとに LLM を呼びます。もう質問があるときは作り直しになります）。</p>`;
}

function renderInterview() {
  const box = $("#interview");
  const iv = S.data.interview;
  if (!iv) { box.innerHTML = `<h2>インタビュー</h2><p class="note">まだ質問がありません。<code>kumimasu interview DIR</code> を実行してください。</p>`; return; }
  box.innerHTML = `<h2>インタビュー</h2><p class="hint">答えは手元の材料として設計と下書きに渡ります。空欄の質問は使われません。</p>` +
    iv.questions.map((q) => `<div class="q"><div class="qt" id="qt-${esc(q.id)}">${esc(q.id)}. ${esc(q.question)}</div>
      ${q.context ? `<p class="ctx">${esc(q.context)}</p>` : ""}
      ${q.units.length || q.why ? `<div class="refline">${q.units.length ? `<span class="refs">参考</span>${refs(q.units)}` : ""}${q.why ? `<span class="why" title="この答えが設計のどこに効くか">${q.units.length ? "・" : ""}${esc(q.why)}</span>` : ""}</div>` : `<div class="refline"></div>`}
      <textarea data-q="${esc(q.id)}" aria-labelledby="qt-${esc(q.id)}">${esc(q.answer)}</textarea></div>`).join("");
  box.querySelectorAll("textarea").forEach((t) => t.addEventListener("input", () => {
    debounce("iv", () => save("/api/interview", { answers: Object.fromEntries([...box.querySelectorAll("textarea")].map((x) => [x.dataset.q, x.value])) }, false));
  }));
}

function renderCounts() {
  const box = $("#counts");
  if (!box) return;
  const n = Object.fromEntries(Object.keys(L().use).map((k) => [k, 0]));
  S.data.design.units.forEach((u) => n[u.use]++);
  box.innerHTML = Object.entries(L().use).map(([k, v]) => `<span>${esc(v)} ${n[k]}</span>`).join("");
}

function renderDesign() {
  const box = $("#design");
  const d = S.data.design;
  if (!d) { box.innerHTML = `<h2>設計</h2><p class="note">まだ設計がありません。インタビューに答えてから <code>kumimasu design DIR</code> を実行してください。</p>`; return; }
  const field = (id, label, hint, input) => `<div class="field"><label for="${id}">${label}</label>${hint ? `<p class="hint">${hint}</p>` : ""}${input}</div>`;
  const area = (id, label, hint, value) => field(id, label, hint, `<textarea id="${id}">${esc(value)}</textarea>`);
  box.innerHTML = `<h2>設計</h2>
    ${area("purpose", "ねらい", "", d.purpose)}
    ${area("takeaways", "読者が持ち帰るもの", "1 行に 1 つ、最大 3 つ", d.takeaways.join("\n"))}
    ${field("target_length", "目標の字数", "", `<div class="length"><input type="number" id="target_length" min="500" step="100" value="${esc(d.target_length)}"><div class="counts" id="counts"></div></div><div id="load"></div>`)}
    <h3>組み立て</h3>
    ${area("order", "順番の手がかり", "1 行に 1 つ", d.order.join("\n"))}
    ${area("forms", "形", "1 行に 1 つ。書き手は必ず使う。ほかの所にも、詰まった比較や手順なら表やリストを足せる", d.forms.join("\n"))}
    ${area("form_prefs", "形の好み", "設計と下書きの依頼にそのまま載る", d.form_prefs)}
    <h3>書く範囲</h3>
    ${area("avoid", "書かない話題", "1 行に 1 つ。下書きの依頼に話題の名前だけが載る", d.avoid.join("\n"))}
    ${area("research", "ウェブで調べること", "1 行に 1 つ、最大 5 つ。調査役には、この一覧と題・読者・ねらい・持ち帰りだけが渡る", d.research.join("\n"))}
    <div class="field"><span class="label">一言（掘り下げる材料のうち、結果を運ぶもの）</span><p class="hint">${esc(L().note_question)}（${d.note_limit} 個まで）。一言を付けた単位は、解釈や感想をその一言の範囲で書く。付けない単位は、結果を述べたら意味づけを足さずに次へ進む</p>
    <div id="notes">${noteItems(d).map((x) => `<div class="noise"><span class="refs">${refs([x.id])}</span><span class="tx">${esc(x.label)}</span><input data-note="${esc(x.id)}" aria-label="${esc(x.id)} への一言" placeholder="一言（無ければ空のまま）" value="${esc(x.note)}"></div>`).join("") || `<p class="note">なし。材料の「結果だけ」で足せます。</p>`}</div></div>
    <div class="field"><span class="label">説明しない前提</span><p class="hint">読者は知っているか、自分で調べる。1–3 個</p>
    <div id="skips">${d.skip.map((x, i) => `<div class="noise"><input data-skip="${i}" aria-label="前提の名前" value="${esc(x.label)}"><span class="refs">${x.units.map(esc).join(", ")}</span></div>`).join("") || `<p class="note">なし。材料の「前提扱い」で足せます。</p>`}</div></div>
    <div class="field"><span class="label">脱線</span><p class="hint">著者が出くわした場面に入れる。1–2 個</p>
    <div id="asides">${d.aside.map((x, i) => `<div class="noise"><span class="refs">${esc(x.id)}</span><input data-aside="${i}" aria-label="場所の手がかり" placeholder="場所の手がかり" value="${esc(x.where)}"></div>`).join("") || `<p class="note">なし。材料の「脱線」で足せます。</p>`}</div></div>
    <div id="terms"></div>
    <div id="conflicts"></div>
    <h3>書き方のルール</h3><p class="hint">オフのルールは design.yaml に残り、下書きの依頼には載らない</p>
    <div id="rules"></div>`;
  const lines = (id) => $(id).value.split("\n").map((s) => s.trim()).filter(Boolean);
  const push = () => debounce("design", () => save("/api/design", {
    purpose: $("#purpose").value, takeaways: lines("#takeaways").slice(0, 3), order: lines("#order"), avoid: lines("#avoid"),
    research: lines("#research").slice(0, 5), forms: lines("#forms"), form_prefs: $("#form_prefs").value,
    target_length: parseInt($("#target_length").value, 10) || d.target_length,
  }, false));
  renderCounts();
  renderLoad();
  renderTerms();
  renderConflicts();
  renderRules();
  ["#purpose", "#takeaways", "#order", "#avoid", "#research", "#forms", "#form_prefs", "#target_length"].forEach((id) => $(id).addEventListener("input", push));
  box.querySelectorAll("input[data-skip]").forEach((el) => el.addEventListener("input", () => {
    d.skip[+el.dataset.skip].label = el.value;
    debounce("skip", () => save("/api/design", { skip: d.skip }, false));
  }));
  box.querySelectorAll("input[data-note]").forEach((el) => el.addEventListener("input", () => {
    debounce("note", () => save("/api/design", { notes: Object.fromEntries([...box.querySelectorAll("input[data-note]")].map((x) => [x.dataset.note, x.value])) }, false));
  }));
  box.querySelectorAll("input[data-aside]").forEach((el) => el.addEventListener("input", () => {
    d.aside[+el.dataset.aside].where = el.value;
    debounce("aside", () => save("/api/design", { aside: d.aside }, false));
  }));
}

function noteItems(d) {
  return d.units.filter((x) => unitById(x.id) && ((x.use === "deep" && x.land) || ((x.use === "deep" || x.use === "mention") && x.note.trim()))).map((x) => {
    const t = unitById(x.id).text.replace(/\s+/g, " ").trim();
    return { id: x.id, note: x.note, label: x.label || (t.length > 40 ? t.slice(0, 40) + "…" : t) };
  });
}

function renderRules() {
  const box = $("#rules");
  if (!box) return;
  const d = S.data.design;
  const push = (now) => {
    const send = () => save("/api/design", { rules: d.rules.map((r) => ({ text: r.text, on: r.on })) }, false);
    if (now) send(); else debounce("rules", send);
  };
  box.innerHTML = d.rules.map((r, i) => `<div class="rule${r.on ? "" : " off"}">
      <input type="checkbox" data-i="${i}" ${r.on ? "checked" : ""} title="オン・オフ" aria-label="ルールを使う">
      <input type="text" data-i="${i}" aria-label="ルール" value="${esc(r.text)}">
      <button data-del="${i}" title="削除" aria-label="削除">×</button></div>`).join("") +
    `<button id="addrule" class="btn add">ルールを足す</button>`;
  box.querySelectorAll("input[type=checkbox]").forEach((el) => el.addEventListener("change", () => {
    d.rules[+el.dataset.i].on = el.checked;
    el.parentElement.classList.toggle("off", !el.checked);
    push(true);
  }));
  box.querySelectorAll("input[type=text]").forEach((el) => el.addEventListener("input", () => {
    d.rules[+el.dataset.i].text = el.value;
    push(false);
  }));
  box.querySelectorAll("button[data-del]").forEach((el) => el.addEventListener("click", () => {
    d.rules.splice(+el.dataset.del, 1);
    renderRules();
    push(true);
  }));
  $("#addrule").addEventListener("click", () => {
    d.rules.push({ text: "", on: true });
    renderRules();
    box.querySelector(`input[type=text][data-i="${d.rules.length - 1}"]`).focus();
  });
}

const num = (n) => Number(n).toLocaleString("ja-JP");
const refList = (ids, n = 6) => refs(ids.slice(0, n)) + (ids.length > n ? `<span>ほか ${ids.length - n}</span>` : "");

function renderLoad() {
  const box = $("#load");
  const ld = S.data.load;
  if (!box || !ld) return;
  const scale = Math.max(ld.max_ratio * 1.5, ld.ratio);
  box.className = "load" + (ld.over ? " over" : "");
  const sug = ld.suggestions;
  box.innerHTML = `<div class="sum"><span>使う材料 <b>${num(ld.kept_chars)} 字</b>（目標の <b>${ld.ratio} 倍</b>）</span><span>触れる ${ld.mention} 個（目安 ${ld.mention_max} 個まで）</span></div>
    <div class="meter" role="img" aria-label="使う材料は目標の字数の ${ld.ratio} 倍。目安は ${ld.max_ratio} 倍まで"><i style="width:${Math.min(100, ld.ratio / scale * 100)}%"></i><s style="left:${ld.max_ratio / scale * 100}%"></s></div>` +
    (ld.over ? `<div class="advice">${ld.reasons.map((r) => `<p>${esc(r)}。書き手が全部を少しずつ詰め込み、説明が抜けやすくなります。</p>`).join("")}
      ${sug.length ? `<p class="label">減らす候補（触れる → 書かない）</p><ul>${sug.map((x) => `<li>${refs([x.id])}<span class="tx" title="${esc(x.text)}">${esc(x.reason)}・${num(x.chars)} 字　${esc(x.text)}</span><button type="button" class="btn" data-drop="${esc(x.id)}">書かないにする</button></li>`).join("")}</ul>` : ""}
      <div class="acts">${sug.length > 1 ? `<button type="button" class="btn" id="drop-all">候補 ${sug.length} 個をまとめて書かないにする</button>` : ""}
      ${ld.suggest_length ? `<button type="button" class="btn quiet" id="raise-length">目標を ${num(ld.suggest_length)} 字に上げる</button>` : ""}</div></div>` : "");
  box.querySelectorAll("button[data-drop]").forEach((b) => b.addEventListener("click", () => save("/api/design", { units: { [b.dataset.drop]: "drop" } }, true)));
  $("#drop-all")?.addEventListener("click", () => save("/api/design", { units: Object.fromEntries(sug.map((x) => [x.id, "drop"])) }, true));
  $("#raise-length")?.addEventListener("click", () => save("/api/design", { target_length: ld.suggest_length }, true));
}

function renderTerms() {
  const box = $("#terms");
  if (!box) return;
  const ts = S.data.terms;
  if (!ts.length) { box.innerHTML = ""; return; }
  const n = (st) => ts.filter((t) => t.status === st).length;
  const how = (t) => {
    switch (t.status) {
      case "kept": return `<div class="refline"><span>説明</span>${refList(t.explained_by)}${t.promoted.length ? `<span>（用語の説明として触れるにした）</span>` : ""}</div>`;
      case "dropped": return `<div class="refline"><span>説明（書かない側）</span>${refList(t.candidates, 4)}<button type="button" class="btn" data-explain="${esc(t.term)}">説明を触れるにする</button></div>`;
      case "missing": return `<div class="refline"><span>材料に説明が無いので、書き手が初出で説明する</span></div>`;
      default: return `<div class="refline"><span>説明しない前提にした</span></div>`;
    }
  };
  box.innerHTML = `<span class="label">読者が知らない用語</span><p class="hint">使う材料に出てくる、読者が知らないかもしれない言葉と、その説明の材料。説明が書かない側 ${n("dropped")}・材料に説明が無い ${n("missing")}・説明を使う ${n("kept")}。use を変えたら <code>kumimasu review DIR</code> で計算し直す</p>
    <ul class="terms">${ts.map((t) => `<li class="${t.status}"><div class="what"><b>${esc(t.term)}</b><span class="lv">${esc(t.label)}</span></div>
      ${t.why ? `<div class="refline"><span>${esc(t.why)}</span></div>` : ""}
      <div class="refline"><span>使う所</span>${refList(t.used_by)}</div>${how(t)}</li>`).join("")}</ul>`;
  box.querySelectorAll("button[data-explain]").forEach((b) => b.addEventListener("click", () => save("/api/design", { explain: b.dataset.explain }, true)));
}

function renderConflicts() {
  const box = $("#conflicts");
  if (!box) return;
  const cs = S.data.conflicts;
  box.innerHTML = cs.length ? `<span class="label">書かないにしたのに、使う材料から出てしまう内容</span><p class="hint">原因の材料を書かないにするか、出てもよいならそのままにする。use を変えたら <code>kumimasu review DIR</code> で計算し直す</p>` +
    `<ul class="conflicts">${cs.map((c) => `<li><div class="what">${c.note ? `「${esc(c.note)}」` : "書かないにした内容"}<span class="lv">${c.level === "yes" ? "ほぼそのまま出る" : "一部が出る"}</span></div>
      <div class="refline"><span>原因</span>${refs(c.by)}</div></li>`).join("")}</ul>` : "";
}

function debounce(key, fn) {
  status("未保存");
  clearTimeout(S.timers[key]);
  S.timers[key] = setTimeout(() => { delete S.timers[key]; fn(); }, 600);
}

function unitsChanged() {
  const d = S.data.design;
  return JSON.stringify([S.filter, S.data.units, d && [d.units, d.skip, d.aside]]) !== S.unitsKey;
}

async function save(path, body, rerender) {
  status("保存中…");
  try {
    S.data = await api(path, { method: "PUT", body });
    S.version = S.data.version;
    status("保存しました");
    if (rerender) { renderUnits(); renderDesign(); return; }
    if (unitsChanged()) renderUnits();
    else renderFilters();
    if (S.data.design) { renderCounts(); renderLoad(); renderTerms(); renderConflicts(); }
  } catch (e) { status("保存できません: " + e.message, true); }
}

function renderAll() {
  const p = S.data.project;
  $("#topic").textContent = p.topic;
  document.title = "記事を書く: " + p.topic;
  $("#meta").innerHTML = [`読者 ${p.audience}`, `種類 ${p.kind}`, `目標 ${S.data.design ? S.data.design.target_length : p.length} 字`, `材料 ${S.data.units.length} 単位`, `ラウンド ${S.data.stage.round}`].map((x) => `<span>${esc(x)}</span>`).join("");
  renderUnits(); renderInterview(); renderDesign(); renderDigest();
}

async function boot() {
  try {
    S.data = await api("/api/state");
  } catch (e) { status("読み込めません: " + e.message, true); return; }
  S.version = S.data.version;
  renderAll();
  showScreen(S.data.stage.stage);
  status("読み込みました");
  setTimeout(poll, S.data.poll_seconds * 1000);
}

function renderStages() {
  const st = S.data.stage;
  const cur = st.stages.indexOf(st.stage);
  $("#stages").innerHTML = st.stages.map((s, i) =>
    `<button data-st="${s}" class="${i === cur ? "cur" : ""}${s === S.viewing ? " on" : ""}" ${i > cur ? "disabled" : ""}${s === S.viewing ? ' aria-current="page"' : ""}><span class="n">${i + 1}</span>${esc(st.labels[s])}</button>`)
    .join("");
  $("#stages").querySelectorAll("button[data-st]").forEach((b) => b.addEventListener("click", () => showScreen(b.dataset.st)));
}

function renderWait(w, last) {
  $("#wait-pulse").classList.toggle("still", !w);
  $("#wait-title").textContent = w ? w.title : "下書きは書き終わりました";
  $("#wait-detail").textContent = w ? w.detail : "下書きと検査の結果は、最終チェックの画面で見られます。";
  $("#wait-steps").innerHTML = w ? w.steps.map((x) => `<li class="${x.state}"${x.state === "now" ? ' aria-current="step"' : ""}>${esc(x.label)}</li>`).join("") : "";
  $("#wait-next").textContent = w ? w.next : "";
  $("#wait-note").innerHTML = w && last && last.note ? `<p class="label">エージェントへの指示（本人が書いたもの）</p><p>${esc(last.note)}</p>` : "";
}

function showScreen(s) {
  S.viewing = s;
  closeRef();
  const st = S.data.stage;
  const wait = s === st.stage ? st.waiting : null;
  const editable = s === st.stage && L().human_stages.includes(s) && !wait;
  const screen = wait || s === "drafting" ? "wait" : s === "interview" || s === "design" ? "design" : "final";
  $("#view-design").hidden = screen !== "design";
  $("#view-wait").hidden = screen !== "wait";
  $("#view-final").hidden = screen !== "final";
  $("#design").hidden = s === "interview";
  $("#interview").inert = !(editable && s === "interview");
  $("#design").inert = !(editable && s === "design");
  $("#units").inert = !(editable && s === "design");
  $("#fc-article").inert = !editable;
  $("#fc-items").inert = !editable;
  $("#fc-apply").hidden = !editable;
  const banner = $("#ro-banner");
  const last = st.last_handoff;
  const done = st.handoff;
  const opts = s !== st.stage ? st.restart[s] : null;
  if (st.stage === "done" && (s === "review" || s === "done")) {
    banner.hidden = false;
    banner.textContent = `完了しました。確定した記事: ${done && done.final ? done.final : ""}`;
  } else if (!editable && (screen !== "wait" || s !== st.stage)) {
    banner.hidden = false;
    banner.innerHTML = `<span>読み取り専用（今の段階: ${esc(st.labels[st.stage])}、ラウンド ${st.round}）</span>` +
      (opts ? `<button type="button" class="btn quiet" id="restart-open" aria-haspopup="dialog">この段階からやり直す</button>` : "");
    $("#restart-open")?.addEventListener("click", () => openRestart(s, opts));
  } else banner.hidden = true;
  if (screen === "wait") renderWait(wait, last);
  $("#confirm-bar").hidden = !editable;
  renderStages();
  renderDigest();
  if (screen === "final") openFinal().catch((e) => status("読み込めません: " + e.message, true));
}

function openRestart(s, opts) {
  const st = S.data.stage;
  const dlg = $("#restart-dlg");
  dlg.innerHTML = `<form><div class="head"><div><h2 id="restart-title">「${esc(st.labels[s])}」からやり直す</h2>
      <p class="note">ラウンド ${st.round + 1} を始めます。これまでのファイル（質問と答え・設計・下書き・確定した記事）は消えずに残り、ラウンド ${st.round} は読み取り専用になります。</p></div></div>
    <div class="body">
      <fieldset><legend class="label">どうやり直すか</legend>${opts.map((o, i) => `<label class="mode"><input type="radio" name="mode" value="${esc(o.mode)}"${i === 0 ? " checked" : ""}><b>${esc(o.label)}</b><span class="note">${esc(o.detail)}</span></label>`).join("")}</fieldset>
      <label for="restart-note">エージェントへの指示（任意）</label>
      <textarea id="restart-note" rows="2" placeholder="例: 2 問目の答えを足したので、設計で反映してほしい"></textarea>
      <p class="warn-box" id="restart-err" role="alert"></p>
      <div class="acts"><button type="button" class="btn" id="restart-cancel">やめる</button><button type="submit" class="primary" id="restart-go">やり直す</button></div>
    </div></form>`;
  $("#restart-cancel").addEventListener("click", () => dlg.close());
  dlg.querySelector("form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const mode = dlg.querySelector("input[name=mode]:checked").value;
    const go = $("#restart-go");
    go.disabled = true;
    try {
      const r = await api("/api/restart", { method: "POST", body: { from: s, mode, note: $("#restart-note").value } });
      dlg.close();
      S.data = r;
      S.version = r.version;
      renderAll();
      showScreen(r.stage.stage);
      status(`ラウンド ${r.stage.round} を「${r.stage.labels[s]}」から始めました`);
    } catch (e) {
      $("#restart-err").textContent = "やり直せません: " + e.message;
      go.disabled = false;
    }
  });
  dlg.showModal();
}

function busy() {
  return Object.keys(S.timers).length > 0 || FC.timer || Date.now() - S.lastInput < 4000 || !$("#fc-pop").hidden || $("#fc-diff").open || $("#restart-dlg").open;
}

async function poll() {
  try {
    const r = await request("/api/version", { headers: { "If-None-Match": `"${S.version}"` } });
    if (r.status === 200) {
      const v = await r.json();
      if (v.version !== S.version && !busy()) await reload();
    }
  } catch (e) { /* the server may be restarting; try again on the next tick */ }
  setTimeout(poll, S.data.poll_seconds * 1000);
}

async function reload() {
  const prev = S.data.stage.stage, prevWait = S.data.stage.waiting;
  S.data = await api("/api/state");
  S.version = S.data.version;
  renderAll();
  const now = S.data.stage.stage, wait = S.data.stage.waiting;
  showScreen(now !== prev ? now : S.viewing);
  status(now !== prev ? `段階が「${S.data.stage.labels[now]}」になりました`
    : prevWait && !wait ? "エージェントの作業が終わりました" : wait ? wait.title : "更新しました");
}

const REF = { id: null, pinned: false, anchor: null, timer: null };

function closeRef() {
  clearTimeout(REF.timer);
  if (REF.anchor) REF.anchor.classList.remove("on");
  Object.assign(REF, { id: null, pinned: false, anchor: null });
  $("#ref-pop").hidden = true;
}

function openRef(a, pinned) {
  const u = unitById(a.dataset.ref);
  if (!u) return;
  if (REF.anchor && REF.anchor !== a) REF.anchor.classList.remove("on");
  Object.assign(REF, { id: u.id, pinned, anchor: a });
  a.classList.add("on");
  const raw = a.dataset.ref.startsWith("raw:");
  const tag = raw ? "digest 前の単位" : u.origin === "answer" ? "回答" : L().searchable[u.searchable];
  const color = raw ? "var(--line)" : u.origin === "answer" ? "var(--answer)" : COLOR[u.searchable];
  const where = unitWhere(u);
  const origs = !raw && u.origin === "digest" ? (u.from || []).map((i) => S.data.originals[i]).filter(Boolean) : [];

    ${u.kind === "code" ? `<pre>${esc(u.text)}</pre>` : `<div class="text">${linkify(u.text)}</div>`}
    ${origs.length ? `<div class="origs"><span class="label">書き直す前の単位（digest の元）</span>${origs.map((o) => `<div class="o"><div class="head"><span class="id">${esc(o.id)}</span>${unitWhere(o) ? `<span>${esc(unitWhere(o))}</span>` : ""}</div>${o.kind === "code" ? `<pre>${esc(o.text)}</pre>` : `<div class="text">${linkify(o.text)}</div>`}</div>`).join("")}</div>` : ""}
    ${$("#view-design").hidden || raw ? "" : `<div class="acts"><button type="button" class="btn quiet" data-jump="${esc(u.id)}">材料の一覧で見る</button></div>`}`;
  pop.querySelector("[data-jump]")?.addEventListener("click", () => jumpToUnit(u.id));
  placeFcPop(pop, a.getBoundingClientRect());
}

function cpLen(text) {
  let n = 0;
  for (let i = 0; i < text.length; i += text.codePointAt(i) > 0xffff ? 2 : 1) n++;
  return n;
}

function u16(text, cp) {
  let i = 0;
  for (; cp > 0 && i < text.length; cp--) i += text.codePointAt(i) > 0xffff ? 2 : 1;
  return i;
}

function spanTable(root) {
  const table = [];
  for (const sp of root.querySelectorAll("span[data-s]")) {
    let at = +sp.dataset.s;
    const walker = document.createTreeWalker(sp, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      const n = cpLen(walker.currentNode.data);
      table.push({ node: walker.currentNode, start: at, len: n });
      at += n;
    }
  }
  return table.sort((a, b) => a.start - b.start);
}

function firstAfter(table, pos) {
  let lo = 0, hi = table.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (table[mid].start + table[mid].len <= pos) lo = mid + 1; else hi = mid;
  }
  return lo;
}

function wrapRange(table, a, b, make) {
  let k = firstAfter(table, a);
  while (k < table.length && table[k].start < b) {
    const e = table[k];
    const x = Math.max(a, e.start) - e.start, y = Math.min(b, e.start + e.len) - e.start;
    if (x >= y || (make.skip && make.skip(e.node))) { k++; continue; }
    const parts = [];
    let mid = e.node;
    if (x > 0) { parts.push({ node: mid, start: e.start, len: x }); mid = mid.splitText(u16(mid.data, x)); }
    if (y < e.len) mid.splitText(u16(mid.data, y - x));
    const right = y < e.len ? mid.nextSibling : null;
    const w = make();
    mid.parentNode.insertBefore(w, mid);
    w.appendChild(mid);
    parts.push({ node: mid, start: e.start + x, len: y - x });
    if (right) parts.push({ node: right, start: e.start + y, len: e.len - y });
    table.splice(k, 1, ...parts);
    k += parts.length;
  }
}

function insertAt(table, pos, el) {
  const k = Math.min(firstAfter(table, pos), table.length - 1);
  if (k < 0) return;
  const e = table[k];
  const x = Math.max(0, Math.min(e.len, pos - e.start));
  const rest = x < e.len ? e.node.splitText(u16(e.node.data, x)) : null;
  e.node.parentNode.insertBefore(el, rest || e.node.nextSibling);
  if (rest) table.splice(k, 1, { node: e.node, start: e.start, len: x }, { node: rest, start: pos, len: e.len - x });
}

function offsetOf(node, off) {
  if (node.nodeType !== 3) return null;
  const e = FC.table.find((x) => x.node === node);
  return e ? e.start + cpLen(node.data.slice(0, off)) : null;
}

async function openFinal() {
  const r = await api("/api/drafts");
  const drafts = r.drafts.map((d) => d.name);
  FC.finals = Object.fromEntries(r.drafts.map((d) => [d.name, d.final]));
  const sel = $("#fc-draft");
  sel.innerHTML = drafts.map((d) => `<option value="${esc(d)}">${esc(d)}${FC.finals[d] ? "（反映済み）" : ""}</option>`).join("");
  if (!drafts.length) { $("#fc-article").innerHTML = `<p class="note">draft*.md がありません。</p>`; return; }
  const want = S.data.stage.draft;
  FC.draft = drafts.includes(FC.draft) ? FC.draft : drafts.includes(want) ? want : drafts[0];
  sel.value = FC.draft;
  await loadDraft(FC.draft);
}

async function loadDraft(name) {
  FC.draft = name;
  FC.viewing = false;
  FC.final = null;
  const r = await api(draftPath("review"));
  FC.html = r.html; FC.items = r.items; FC.dirty = r.dirty; FC.figures = r.figures || [];
  renderUsed(r.used);
  if ($("#fc-diff").open) $("#fc-diff").close();
  paintFinal();
  renderResult();
  setApplyEnabled();
  if (!r.checked) status("この下書きの検査結果がありません（kumimasu check --draft " + name + "）");
}

function setApplyEnabled() {
  const b = $("#fc-apply");
  b.disabled = FC.viewing || !FC.dirty;
  b.title = FC.viewing ? "決定は元の下書きで変えます" : FC.dirty ? "" : "前回の反映から決定が変わっていません";
}

function renderUsed(u) {
  const box = $("#fc-used");
  box.hidden = !u;
  if (!u) return;
  const list = (xs) => xs.length ? `<ul>${xs.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : "<p class=\"note\">なし</p>";
  $("#fc-used-body").innerHTML = `<p>文体: ${esc(L().register[u.register] || u.register)} · 書かない事柄の載せ方: ${esc(u.drop_list)} · 設計: ${esc(u.design)}</p>
    <p>LLM: ${Object.entries(u.providers).map(([k, v]) => `${esc(k)}=${esc(v)}`).join(" · ")}</p>
    <h4>書き方のルール（オン）</h4>${list(u.rules)}
    ${u.rules_off.length ? `<h4>オフにしたルール</h4>${list(u.rules_off)}` : ""}
    <h4>書かない話題</h4>${list(u.avoid)}
    <h4>形</h4>${list(u.forms)}${u.form_prefs ? `<p>好み: ${esc(u.form_prefs)}</p>` : ""}
    ${u.skip.length ? `<h4>説明しない前提</h4>${list(u.skip)}` : ""}
    ${u.aside.length ? `<h4>脱線</h4>${list(u.aside)}` : ""}`;
}

function renderResult() {
  const box = $("#fc-result");
  const out = FC.finals[FC.draft];
  if (!out) { box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = `<span class="what">結果 <b>${esc(out)}</b></span>
    <button id="fc-view" class="btn">${FC.viewing ? "下書きに戻る" : "結果を見る"}</button>
    ${FC.lastApply ? `<button id="fc-diffbtn" class="btn quiet">差分</button>` : ""}
    <button id="fc-copy" class="btn quiet">コピー</button>
    <button id="fc-download" class="btn quiet">ダウンロード</button>
    <span class="note result-note">結果は読み取り専用です。直すときは ${esc(FC.draft)} の決定を変えて反映し直します。</span>
    <textarea id="fc-copybox" readonly hidden></textarea>`;
  $("#fc-view").addEventListener("click", () => toggleResult().catch((e) => status("読み込めません: " + e.message, true)));
  $("#fc-copy").addEventListener("click", copyResult);
  $("#fc-download").addEventListener("click", downloadResult);
  if (FC.lastApply) $("#fc-diffbtn").addEventListener("click", showDiff);
}

async function finalText() {
  if (!FC.final || FC.final.draft !== FC.draft) FC.final = await api(draftPath("final"));
  return FC.final;
}

async function toggleResult() {
  if (FC.viewing) { FC.viewing = false; paintFinal(); renderResult(); setApplyEnabled(); return; }
  const r = await finalText();
  FC.viewing = true;
  const nr = r.changes.filter((c) => c.kind === "rewritten").length, nd = r.changes.filter((c) => c.kind === "deleted").length;
  const art = $("#fc-article");
  art.innerHTML = `<p class="note">${esc(r.final)}（読み取り専用）　<mark class="chg">書き直した所</mark> ${nr}　<span class="chg-del">削除</span> ${nd}　印にマウスを載せると元の文が出ます</p>` + r.html;
  markChanges(spanTable(art), r.changes);
  $("#fc-items").innerHTML = `<p class="note">反映の結果を表示しています。決定は元の下書きで変えます。</p>`;
  $("#fc-legend").hidden = true;
  $("#fc-figs").hidden = true;
  $("#fc-count").textContent = "";
  setApplyEnabled();
  renderResult();
}

function markChanges(table, changes) {
  for (const c of changes.filter((x) => x.kind === "deleted")) {
    const m = document.createElement("span");
    m.className = "chg-del"; m.textContent = "削除"; m.title = "削除した文: " + c.before;
    insertAt(table, c.start, m);
  }
  for (const c of changes.filter((x) => x.kind === "rewritten")) {
    wrapRange(table, c.start, c.end, () => {
      const w = document.createElement("mark");
      w.className = "chg"; w.title = "元の文: " + c.before;
      return w;
    });
  }
}

async function downloadResult() {
  try {
    const r = await request(draftPath("download"));
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    const m = /filename\*=UTF-8''([^;]+)/.exec(r.headers.get("Content-Disposition") || "");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(await r.blob());
    a.download = m ? decodeURIComponent(m[1]) : "final.md";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } catch (e) { status("ダウンロードできません: " + e.message, true); }
}

async function copyResult() {
  let r;
  try { r = await finalText(); } catch (e) { status("読み込めません: " + e.message, true); return; }
  try {
    await navigator.clipboard.writeText(r.markdown);
    status("コピーしました: " + r.final);
  } catch (e) {
    const box = $("#fc-copybox");
    box.hidden = false; box.value = r.markdown; box.focus(); box.select();
    status("クリップボードに書けませんでした。下の欄から手でコピーしてください", true);
  }
}

function paintFinal() {
  const art = $("#fc-article");
  art.innerHTML = FC.html;
  FC.table = spanTable(art);
  const placed = FC.items.filter((i) => i.start !== null && i.end !== null).sort((a, b) => (b.end - b.start) - (a.end - a.start));
  for (const it of placed) {
    wrapRange(FC.table, it.start, it.end, () => {
      const w = document.createElement("mark");
      w.className = "fc " + (it.decision || "");
      w.dataset.item = it.id;
      w.style.setProperty("--c", kindColor(it.kind));
      w.addEventListener("click", (e) => { e.stopPropagation(); itemPop(it.id, w.getBoundingClientRect()); });
      return w;
    });
  }
  renderItems();
  renderFigures();
}

function renderFigures() {
  const box = $("#fc-figs");
  const figs = FC.figures || [];
  box.hidden = !figs.length || FC.viewing;
  if (box.hidden) return;
  box.innerHTML = `<span class="label">図の目印 ${figs.length}（指摘ではありません。確定した記事と一緒に渡り、後で図にします）</span>` +
    figs.map((f, i) => `<button type="button" data-fig="${i}">${esc(f.text)}<span>近く: ${esc(f.near || f.heading || "（先頭）")}</span></button>`).join("");
  box.querySelectorAll("button[data-fig]").forEach((b) => b.addEventListener("click", () => {
    const el = $("#fc-article").querySelectorAll(".fig-ph")[+b.dataset.fig];
    if (!el) return;
    el.scrollIntoView({ block: "center" });
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 1800);
  }));
}

function rewriteBadge(it) {
  if (it.stale) return ` <span class="badge bad">古い（下書きが変わった）</span>`;
  if (it.decision !== "rewrite") return "";
  if (!it.rewrite) return ` <span class="badge">未生成</span>`;
  return ` <span class="badge">固定${it.rewrite.source === "user" ? "・手で直した" : ""}</span>` + (it.note_changed ? ` <span class="badge bad">メモ変更</span>` : "");
}

function itemHead(it) {
  return `<span class="dot" style="--c:${kindColor(it.kind)}"></span><span class="kind">${esc(kindName(it.kind))}</span>` +
    `${it.category ? `<span>${esc(it.category)}</span>` : ""}${it.votes ? `<span>票 ${esc(it.votes)}</span>` : ""}`;
}

function renderLegend() {
  const kinds = [...new Set(FC.items.map((i) => i.kind))];
  const box = $("#fc-legend");
  box.hidden = !kinds.length;
  box.innerHTML = kinds.map((k) => `<span><i class="dot" style="--c:${kindColor(k)}"></i>${esc(kindName(k))}</span>`).join("");
}

function renderItems() {
  const box = $("#fc-items");
  const decided = FC.items.filter((i) => i.decision).length;
  $("#fc-count").textContent = `${FC.items.length} 件中 ${decided} 件決めた`;
  renderLegend();
  box.innerHTML = FC.items.map((it) => `<div class="fc-item${it.decision ? " done" : ""}" data-item="${esc(it.id)}" role="button" tabindex="0">
      <div class="k">${itemHead(it)}${it.start === null ? "<span>位置不明</span>" : ""}</div>
      <div class="t">${esc(it.text.slice(0, 90))}${it.text.length > 90 ? "…" : ""}</div>
      <div class="d"><span class="dec dec-${it.decision || "none"}">${esc(L().decision[it.decision])}</span>${it.note ? `<span>${esc(it.note)}</span>` : ""}${rewriteBadge(it)}</div></div>`).join("") ||
    `<p class="note">検査で当たった箇所はありません。本文を選ぶと自分の項目を足せます。</p>`;
  box.querySelectorAll(".fc-item").forEach((el) => {
    const open = () => {
      const m = [...document.querySelectorAll("mark.fc")].find((x) => x.dataset.item === el.dataset.item);
      document.querySelectorAll("mark.fc.focus").forEach((x) => x.classList.remove("focus"));
      if (m) { m.scrollIntoView({ block: "center" }); m.classList.add("focus"); }
      itemPop(el.dataset.item, (m || el).getBoundingClientRect());
    };
    el.addEventListener("click", open);
    el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });
}

function placeFcPop(pop, rect) {
  pop.hidden = false;
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = rect.left + window.scrollX + rect.width / 2 - w / 2;
  left = Math.max(8 + window.scrollX, Math.min(left, window.scrollX + document.documentElement.clientWidth - w - 8));
  let top = rect.bottom + window.scrollY + 8;
  if (rect.bottom + h + 16 > window.innerHeight) top = Math.max(window.scrollY + 8, rect.top + window.scrollY - h - 8);
  pop.style.left = `${left}px`; pop.style.top = `${top}px`;
}

function decisionButtons(cur) {
  return `<div class="acts"><div class="seg" role="group" aria-label="決定">${Object.entries(L().decision).filter(([d]) => d).map(([d, label]) =>
    `<button data-d="${d}" class="${cur === d ? "on" : ""}">${esc(label)}</button>`).join("")}</div></div>`;
}

function rewriteBlock(it) {
  if (it.decision !== "rewrite") return "";
  if (it.stale) return `<div class="warn-box">下書きが変わったため、この項目は反映しません（元の文: 「${esc(it.rewrite ? it.rewrite.made_from : it.text)}」）。` +
    `決め直すか、書き直し直してください。</div><div class="acts"><button id="fc-regen" class="btn">もう一度書き直す</button></div>`;
  if (!it.rewrite) return `<div class="reason">まだ書き直していません。次の反映で、この項目だけを書き直します。</div>`;
  const src = it.rewrite.source === "user" ? "手で直した" : "LLM";
  return `<label>書き直し結果（${src}・固定。ほかの項目を変えても変わりません${it.rewrite.scope === "sentence" ? "。この文を含む文全体と置き換えます" : ""}）</label>
    <textarea id="fc-rewrite-text">${esc(it.rewrite.result)}</textarea>
    ${it.note_changed ? `<div class="warn-box">メモが、この結果を作った後に変わっています。メモを反映させるなら書き直し直してください。</div>` : ""}
    <div class="acts"><button id="fc-regen" class="btn">もう一度書き直す</button></div>`;
}

function itemPop(id, rect) {
  const cur = () => FC.items.find((x) => x.id === id);
  const it = cur();
  if (!it) return;
  const pop = $("#fc-pop");
  pop.innerHTML = `<div class="k">${itemHead(it)}</div>
    <div class="quote">「${esc(it.text)}」</div>
    ${it.reason ? `<div class="reason">${esc(it.reason)}</div>` : ""}
    ${it.unit ? `<div class="unit">材料 ${esc(it.unit.id)}: ${esc(it.unit.text)}</div>` : ""}
    ${decisionButtons(it.decision)}
    <textarea id="fc-note" aria-label="メモ" placeholder="書き直すときのメモ（任意）">${esc(it.note)}</textarea>
    <div id="fc-rewrite">${rewriteBlock(it)}</div>
    ${it.kind === "user" ? `<div class="acts"><button id="fc-remove" class="btn quiet">この項目を消す</button></div>` : ""}`;
  const refresh = () => { const n = cur(); if (n) { pop.querySelector("#fc-rewrite").innerHTML = rewriteBlock(n); bindRewrite(); } };
  const bindRewrite = () => {
    pop.querySelector("#fc-rewrite-text")?.addEventListener("input", (e) => {
      const c = cur(); if (c && c.rewrite) { c.rewrite.result = e.target.value; c.rewrite.source = "user"; saveReview(false); }
    });
    pop.querySelector("#fc-regen")?.addEventListener("click", async () => {
      const c = cur(); if (!c) return;
      c.regenerate = true;
      await saveReview(true);
      refresh();
    });
  };
  const markDecision = (c) => pop.querySelectorAll("button[data-d]").forEach((x) => x.classList.toggle("on", x.dataset.d === c.decision));
  pop.querySelectorAll("button[data-d]").forEach((b) => b.addEventListener("click", async () => {
    const c = cur(); if (!c) return;
    c.decision = b.dataset.d;
    markDecision(c);
    await saveReview(true);
    refresh();
  }));
  pop.querySelector("#fc-note").addEventListener("input", (e) => {
    const c = cur(); if (!c) return;
    c.note = e.target.value;
    if (c.note && !c.decision) { c.decision = "rewrite"; markDecision(c); }
    saveReview(false);
  });
  bindRewrite();
  pop.querySelector("#fc-remove")?.addEventListener("click", () => {
    FC.items = FC.items.filter((x) => x.id !== id);
    FC.removed.push(id);
    pop.hidden = true;
    saveReview(true);
  });
  placeFcPop(pop, rect);
}

function fcSelection() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  if (!$("#fc-article").contains(r.commonAncestorContainer)) return null;
  const a = offsetOf(r.startContainer, r.startOffset), b = offsetOf(r.endContainer, r.endOffset);
  return a !== null && b !== null && a < b ? { start: a, end: b, quote: sel.toString(), rect: r.getBoundingClientRect() } : null;
}

function newItemPop(t) {
  const pop = $("#fc-pop");
  pop.innerHTML = `<div class="k">${itemHead({ kind: "user" })}</div><div class="quote">「${esc(t.quote.slice(0, 120))}」</div>
    ${decisionButtons("")}<textarea id="fc-note" aria-label="メモ" placeholder="書き直すときのメモ（任意）"></textarea>`;
  pop.querySelectorAll("button[data-d]").forEach((b) => b.addEventListener("click", () => {
    FC.items.push({ kind: "user", start: t.start, end: t.end, text: t.quote, decision: b.dataset.d, note: pop.querySelector("#fc-note").value });
    window.getSelection().removeAllRanges();
    pop.hidden = true;
    saveReview(true);
  }));
  placeFcPop(pop, t.rect);
}

function saveReview(now) {
  status("未保存");
  clearTimeout(FC.timer);
  FC.timer = null;
  if (now) return pushReview(true).catch(() => {});
  FC.timer = setTimeout(() => { FC.timer = null; pushReview(false); }, 600);
}

async function pushReview(repaint) {
  status("保存中…");
  try {
    const items = FC.items.map((i) => ({ ...(i.id ? { id: i.id } : {}), decision: i.decision, note: i.note, start: i.start, end: i.end,
      ...(i.rewrite ? { result: i.rewrite.result } : {}), ...(i.regenerate ? { regenerate: true } : {}) }));
    const r = await api(draftPath("review"), { method: "PUT", body: { items, remove: FC.removed } });
    FC.items = r.items; FC.dirty = r.dirty; FC.removed = []; S.version = r.version;
    setApplyEnabled();
    if (repaint) paintFinal(); else renderItems();
    status("保存しました");
  } catch (e) { status("保存できません: " + e.message, true); throw e; }
}

async function applyFinal() {
  try {
    if (FC.timer) { clearTimeout(FC.timer); FC.timer = null; await pushReview(false); }
    status("反映中…");
    const a = await api(draftPath("apply"), { method: "POST", body: {} });
    FC.items = a.review.items; FC.dirty = a.review.dirty; S.version = a.review.version;
    FC.lastApply = a.result; FC.final = a.final;
    FC.finals[FC.draft] = a.result.out;
    const opt = [...$("#fc-draft").options].find((o) => o.value === FC.draft);
    if (opt) opt.textContent = `${FC.draft}（反映済み）`;
    FC.viewing = false;
    await toggleResult();
    showDiff();
    status("反映しました: " + a.result.out + "（結果を表示しています。決定を変えるときは「下書きに戻る」）");
  } catch (e) { status("反映できません: " + e.message, true); }
}

function showDiff() {
  const r = FC.lastApply;
  if (!r) return;
  const box = $("#fc-diff");
  const cls = { "+": "add", "-": "del", " ": "same" };
  box.innerHTML = `<div class="head"><div><h2>${esc(FC.draft)} → ${esc(r.out)}</h2><p class="note">削った ${r.deleted} · 書き直した ${r.rewritten}（固定の結果を使った ${r.reused}）` +
    `${r.skipped.length ? ` · 反映しなかった ${r.skipped.length}（コードの中、または答えが無い）` : ""}` +
    `${r.stale.length ? ` · 下書きが変わったので反映しなかった ${r.stale.length}` : ""} · 呼び出し ${r.calls}</p></div>` +
    `<button id="fc-diff-close" class="btn">閉じる</button></div>` +
    `<div class="body"><pre>${r.diff.filter(([t]) => t !== " ").map(([t, l]) => `<span class="${cls[t]}">${esc(t)} ${esc(l) || " "}</span>`).join("") || "変更はありません"}</pre></div>`;
  $("#fc-diff-close").addEventListener("click", () => box.close());
  box.onclick = (e) => { if (e.target === box) box.close(); };
  box.showModal();
}

$("#confirm-btn").addEventListener("click", confirmStage);
document.addEventListener("input", () => { S.lastInput = Date.now(); });
$("#fc-draft").addEventListener("change", (e) => loadDraft(e.target.value).catch((err) => status("読み込めません: " + err.message, true)));
$("#fc-apply").addEventListener("click", applyFinal);
$("#fc-article").addEventListener("mouseup", () => setTimeout(() => { if (FC.viewing) return; const t = fcSelection(); if (t) newItemPop(t); }, 0));
document.addEventListener("mousedown", (e) => { const pop = $("#fc-pop"); if (!pop.hidden && !pop.contains(e.target) && !e.target.closest("mark.fc, .fc-item")) pop.hidden = true; });
boot();
</script>
</body>
